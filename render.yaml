# Render blueprint: one Docker web service with a persistent disk. See DEPLOY.md.
# A disk needs a paid instance type — on the free one the journal would vanish on every restart.
services:
  - type: web
    name: azzifa
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /healthz
    disk:
      name: azzifa-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: TRUST_PROXY
        value: "1"
      - key: SIGNUP_CODE      # filled in on the Render dashboard, never committed
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
