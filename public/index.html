// ---------- AI summary of daily activities (History tab) ----------
const SUMMARY_MIN_NOTES = 3;
function setSummaryRange(n){ summaryRange=n; render(); }
async function generateSummary(){
  if(summaryLoading) return;
  summaryLoading=true; summaryErr=null; render();
  try{
    const res = await api('/api/summary', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({range:summaryRange})});
    const data = await res.json();
    if(!res.ok){ summaryErr = data.error || 'Rangkumannya belum berhasil dibuat. Coba lagi sebentar lagi, ya.'; }
    else{ summaryText = data.text; summaryAt = data.at; }
  }catch(e){ summaryErr = 'Azzifa belum bisa terhubung ke server. Coba lagi sebentar lagi, ya.'; }
  summaryLoading=false; render();
}
function renderSummaryCard(){
  const n=totalNotes();
  if(n<SUMMARY_MIN_NOTES){
    const left=SUMMARY_MIN_NOTES-n;
    return `<div class="card summary">
      <h2 class="section-h">Rangkuman kegiatan</h2>
      <p class="summary-hint">Tulis ${left} catatan lagi, lalu Azzifa bisa merangkum kegiatanmu.</p>
      <div class="progress" role="progressbar" aria-label="Catatan menuju rangkuman" aria-valuemin="0" aria-valuemax="${SUMMARY_MIN_NOTES}" aria-valuenow="${n}"><span style="width:${Math.round(n/SUMMARY_MIN_NOTES*100)}%"></span></div>
    </div>`;
  }
  return `<div class="card summary" aria-busy="${summaryLoading}">
    <h2 class="section-h">Rangkuman kegiatan</h2>
    <div class="range-toggle">
      <button class="${summaryRange===7?'active':''}" onclick="setSummaryRange(7)">7 hari terakhir</button>
      <button class="${summaryRange===30?'active':''}" onclick="setSummaryRange(30)">30 hari terakhir</button>
    </div>
    ${summaryLoading
      ? '<div class="skeleton" role="status" aria-label="Membuat rangkuman"><span></span><span></span><span></span><span class="short"></span></div>'
      : (summaryText
          ? `<p class="summary-text">${esc(summaryText)}</p><p class="summary-meta">Dibuat ${fmtDate(summaryAt)}</p>`
          : `<p class="summary-hint">${ai.configured ? 'Ringkas kegiatanmu dari catatan yang sudah kamu tulis.' : 'Di sini nanti Azzifa bisa merangkum kegiatanmu.'}</p>`)}
    ${summaryErr ? `<p class="summary-err" role="alert">${esc(summaryErr)}</p>` : ''}
    ${ai.configured ? `<button class="btn-soft" onclick="generateSummary()" ${summaryLoading?'disabled':''}>${summaryText?'Buat ulang rangkuman':'Rangkum kegiatanku'}</button>
    <p class="summary-privacy">Catatan pada rentang ini dikirim ke ${esc(ai.label)} untuk dirangkum.</p>` : `<p class="summary-privacy">${AI_OFF_NOTE}</p>`}
  </div>`;
}
// ---------- Search, #tags, favourites, day filter (Riwayat) ----------
// Tags are not stored separately: any #word inside a note's text is a tag.
const TAG_RE = /(#[\p{L}\p{N}_]{2,30})/gu;
function tagsOf(text){ return (String(text||'').match(TAG_RE)||[]).map(t=>t.slice(1).toLowerCase()); }
function allTags(){
  const counts={};
  entries.forEach(e=>notesOf(e).forEach(n=>new Set(tagsOf(n.text)).forEach(t=>counts[t]=(counts[t]||0)+1)));
  return Object.entries(counts).sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).slice(0,10);
}
function totalWords(){ return entries.reduce((n,e)=>n+notesOf(e).reduce((m,x)=>m+String(x.text||'').trim().split(/\s+/).filter(Boolean).length,0),0); }
const escAttr = s => esc(s).replace(/"/g,'&quot;');
function highlight(raw){
  const q=histQuery.trim();
  if(!q) return esc(raw);
  const re=new RegExp('('+q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','gi');
  return String(raw==null?'':raw).split(re).map((p,i)=>i%2?`<mark>${esc(p)}</mark>`:esc(p)).join('');
}
// Note text with search hits marked and #tags turned into filter buttons.
function richText(raw){
  return String(raw==null?'':raw).split(TAG_RE).map((p,i)=>i%2
    ? `<button class="tag" onclick="setHistTag('${p.slice(1).toLowerCase()}')">${highlight(p)}</button>`
    : highlight(p)).join('');
}
function histActive(){ return !!(histQuery.trim()||histMood||histTag||histFav||histDate); }
function histFiltered(){
  const q=histQuery.trim().toLowerCase();
  return [...entries].sort((a,b)=>b.date.localeCompare(a.date))
    .filter(e=>(!histDate||e.date===histDate) && (!histMood||e.mood===histMood))
    .map(e=>({e, notes:notesOf(e).map((n,i)=>({n,i})).filter(({n})=>   // i stays the note's real index, for delete/favourite
      (!histFav||n.fav) && (!histTag||tagsOf(n.text).includes(histTag)) &&
      (!q || String(n.text||'').toLowerCase().includes(q) || String(n.prompt||'').toLowerCase().includes(q)))}))
    .filter(x=>x.notes.length);
}
function resetHist(){ histQuery=''; histMood=null; histTag=null; histFav=false; histDate=null; render(); }
function setHistMood(k){ histMood = histMood===k ? null : k; render(); }
function setHistTag(t){ histTag = histTag===t ? null : t; render(); }
function toggleHistFav(){ histFav=!histFav; render(); }
function clearHistDate(){ histDate=null; render(); }
// Typing only repaints the list, so the search box keeps focus and caret.
function onSearch(v){ histQuery=v; const el=document.getElementById('histList'); if(el) el.innerHTML=renderHistoryList(); }
// Calendar and "on this day" both land here: Riwayat narrowed to a single date.
function openDay(date){ histQuery=''; histMood=null; histTag=null; histFav=false; histDate=date; setTab('history'); }
async function toggleFav(date, idx){
  const existing=entries.find(e=>e.date===date);
  if(!existing) return;
  const notes=notesOf(existing).map((n,i)=>i===idx ? {...n, fav:!n.fav} : {...n});
  const entry={...existing, notes};
  try{ await persistEntry(entry); }
  catch(e){ showToast('Belum berhasil tersimpan. Tulisanmu masih aman di sini, coba lagi sebentar lagi, ya.'); return; }
  entries=[...entries.filter(e=>e.date!==date), entry];
  render();
}

// ---------- Backup and restore (.json) ----------
function exportJson(){
  if(entries.length===0){ showToast('Belum ada catatan untuk dicadangkan. Mulai dari satu catatan dulu, ya.'); return; }
  window.location.href = '/api/export.json';
}
function pickImport(){ document.getElementById('importFile')?.click(); }
async function readImport(input){
  const file=input.files && input.files[0];
  if(!file) return;
  try{
    const data=JSON.parse(await file.text());
    const list=Array.isArray(data) ? data : (data && data.entries);
    if(!Array.isArray(list) || list.length===0) throw new Error('empty');
    importPending=list;
  }catch(e){ importPending=null; showToast('File cadangannya belum bisa dibaca. Pastikan itu file .json dari Azzifa, ya.'); }
  render();
}
function cancelImport(){ importPending=null; render(); }
async function confirmImport(){
  if(!importPending || importBusy) return;
  importBusy=true; render();
  try{
    const res=await api('/api/import', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({entries:importPending})});
    const data=await res.json();
    if(!res.ok){ showToast(data.error || 'Cadangannya belum berhasil dipulihkan. Coba lagi sebentar lagi, ya.'); }
    else{
      entries=await api('/api/entries').then(r=>r.json());
      showToast(`${data.imported} hari catatanmu sudah kembali.`);
    }
  }catch(e){ showToast('Azzifa belum bisa terhubung ke server. Coba lagi sebentar lagi, ya.'); }
  importPending=null; importBusy=false; render();
}
// Same in-page two-step confirm as deleting a note: restoring overwrites days that already exist.
function renderBackupConfirm(){
  return `<input type="file" id="importFile" accept="application/json,.json" hidden onchange="readImport(this)">
    ${importPending ? `<div class="confirm-row block" role="alert">
      <span>Pulihkan ${importPending.length} hari dari cadangan? Tanggal yang sama akan ditimpa.</span>
      <button class="btn-ghost-sm danger" onclick="confirmImport()" ${importBusy?'disabled':''}>${importBusy?'Memulihkan...':'Ya, pulihkan'}</button>
      <button class="btn-ghost-sm" onclick="cancelImport()" ${importBusy?'disabled':''}>Batal</button>
    </div>` : ''}`;
}

function renderHistoryList(){
  const rows=histFiltered();
  if(rows.length===0) return `<div class="empty">${EMPTY_ILLUSTRATION}<div style="margin-top:10px;">Tidak ada catatan yang cocok.</div><button class="btn-ghost-sm" onclick="resetHist()">Hapus semua saringan</button></div>`;
  const count=rows.reduce((n,r)=>n+r.notes.length,0);
  return `
    <h2 class="section-h">${histActive() ? `${count} catatan ditemukan` : 'Catatan yang sudah kamu tulis'}</h2>
    ${rows.map(({e,notes})=>{ const total=notesOf(e).length; return `<div class="entry">
      <div class="entry-head"><span class="dot" style="background:${moodInfo(e.mood).c}"></span><span class="entry-date">${fmtDate(e.date)} · ${moodInfo(e.mood).l}${total>1?` · ${total} catatan`:''}</span></div>
      ${notes.map(({n,i},pos)=>{
        const pendingDelete = confirmDeleteKey===(e.date+'::'+i);
        return `<div class="note-block${pos>0?' divider':''}">
          <div class="row-head">
            <div class="entry-prompt">${highlight(n.prompt)}</div>
            ${pendingDelete ? '' : `<div class="row-actions">
              <button class="icon-ghost${n.fav?' on':''}" onclick="toggleFav('${e.date}', ${i})" title="${n.fav?'Hapus dari favorit':'Tandai favorit'}" aria-label="Favorit" aria-pressed="${!!n.fav}">${n.fav?ICONS.starFill:ICONS.star}</button>
              <button class="icon-ghost" onclick="askDeleteNote('${e.date}', ${i})" title="Hapus catatan" aria-label="Hapus catatan">${ICONS.trash}</button>
            </div>`}
          </div>
          ${n.text ? `<div class="entry-text">${richText(n.text)}</div>` : ''}${renderPhotos(n.photos)}
          ${pendingDelete ? `<div class="confirm-row">
            <span>Hapus catatan ini?</span>
            <button class="btn-ghost-sm danger" onclick="deleteNote('${e.date}', ${i})">Ya, hapus</button>
            <button class="btn-ghost-sm" onclick="cancelDeleteNote()">Batal</button>
          </div>` : ''}
        </div>`;
      }).join('')}
    </div>`; }).join('')}`;
}
function renderHistory(){
  if(entries.length===0) return `
    <div class="card empty">${EMPTY_ILLUSTRATION}<div style="margin-top:10px;">Belum ada catatan.<br>Mulai dari tab "Hari ini".</div></div>
    <div class="actions"><button onclick="pickImport()" style="grid-column:1/-1">Pulihkan dari cadangan .json</button></div>
    ${renderBackupConfirm()}`;
  const idxs=entries.map(e=>MOOD_ORDER.indexOf(e.mood)).filter(i=>i>=0);
  const avgLabel=MOOD_ORDER[Math.round(idxs.reduce((a,b)=>a+b,0)/idxs.length)]||'biasa';
  return `
    <div class="col col-side">
    <div class="bento three">
      <div class="stat"><b>${totalNotes()}</b><span>Total catatan</span></div>
      <div class="stat"><b>${totalWords().toLocaleString('id-ID')}</b><span>Kata ditulis</span></div>
      <div class="stat"><b>${moodInfo(avgLabel).e}</b><span>Rata-rata mood</span></div>
    </div>
    <label class="search">${ICONS.search}<input id="histSearch" type="search" placeholder="Cari di catatanmu" value="${escAttr(histQuery)}" oninput="onSearch(this.value)" aria-label="Cari catatan" autocomplete="off"></label>
    <div class="chips" role="group" aria-label="Saring catatan">
      ${histDate ? `<button class="chip active" onclick="clearHistDate()" title="Hapus saringan tanggal">${fmtDate(histDate)} ✕</button>` : ''}
      <button class="chip${histFav?' active':''}" aria-pressed="${histFav}" onclick="toggleHistFav()">${ICONS.star}Favorit</button>
      ${MOODS.map(m=>`<button class="chip${histMood===m.k?' active':''}" aria-pressed="${histMood===m.k}" onclick="setHistMood('${m.k}')">${m.e} ${m.l}</button>`).join('')}
      ${allTags().map(([t])=>`<button class="chip${histTag===t?' active':''}" aria-pressed="${histTag===t}" onclick="setHistTag('${t}')">#${esc(t)}</button>`).join('')}
    </div>
    ${renderSummaryCard()}
    <div class="actions">
      <button onclick="exportTxt()">Ekspor .txt</button>
      <button onclick="printReport()">Cetak / PDF</button>
      <button onclick="exportJson()">Cadangkan .json</button>
      <button onclick="pickImport()">Pulihkan cadangan</button>
    </div>
    ${renderBackupConfirm()}
    </div>
    <div class="col col-main">
    <div class="card" id="histList">${renderHistoryList()}</div>
    </div>
  `;
}

// ---------- On this day (Hari ini) ----------
// The same date a week, a month, 3 and 6 months ago, and in every earlier year.
function lookbacks(){
  const today=todayStr(); const [y,m,d]=today.split('-').map(Number);
  const byDate={}; entries.forEach(e=>byDate[e.date]=e);
  const out=[], seen=new Set();
  const add=(label,date)=>{ if(date<today && byDate[date] && !seen.has(date)){ seen.add(date); out.push({label, entry:byDate[date]}); } };
  add('Seminggu lalu', new Date(Date.UTC(y,m-1,d-7)).toISOString().slice(0,10));
  [[1,'Sebulan lalu'],[3,'3 bulan lalu'],[6,'6 bulan lalu']].forEach(([n,label])=>{
    const dt=new Date(Date.UTC(y,m-1-n,d));
    if(dt.getUTCDate()===d) add(label, dt.toISOString().slice(0,10));   // skip when that month has no such day
  });
  entries.filter(e=>e.date.slice(5)===today.slice(5)).sort((a,b)=>b.date.localeCompare(a.date))
    .forEach(e=>add(`${y-Number(e.date.slice(0,4))} tahun lalu`, e.date));
  return out;
}
function renderOnThisDay(){
  const items=lookbacks();
  if(!items.length) return '';
  return `<section class="card">
    <span class="eyebrow">Kilas balik</span>
    <h2 class="section-h">Hari ini di masa lalu</h2>
    ${items.map(({label,entry})=>{ const mi=moodInfo(entry.mood); return `<button class="otd-item" onclick="openDay('${entry.date}')">
      <span class="otd-body">
        <span class="otd-when"><b>${label}</b><span class="dot" style="background:${mi.c}"></span>${fmtDate(entry.date)} · ${mi.l}</span>
        <span class="otd-text">${esc(notesOf(entry)[0].text || 'Catatan berfoto')}</span>
      </span>
      <span class="otd-go" aria-hidden="true">${ICONS.chev}</span>
    </button>`; }).join('')}
  </section>`;
}

// Entry choreography: each block of the tab fades up as it scrolls into view. Armed only when
// animateContent is set (first load, tab change) — ordinary re-renders must not replay it.
let revealObs=null;
function armReveal(){
  if(!('IntersectionObserver' in window)) return;
  const els=document.querySelectorAll('.content > :not(.col), .content > .col > *');
  els.forEach(el=>el.classList.add('reveal'));
  revealObs=new IntersectionObserver(list=>{
    let i=0;
    list.forEach(en=>{
      if(!en.isIntersecting) return;
      en.target.style.setProperty('--i', i++);
      en.target.classList.add('in');
      revealObs.unobserve(en.target);
    });
  }, {rootMargin:'0px 0px -6% 0px'});
  els.forEach(el=>revealObs.observe(el));
}
function render(){
  const authed = !!me;
  const checkins=rollingCheckins(7);
  const intro = introPlayed ? '' : ' intro'; introPlayed = true;
  const animate = animateContent && entriesReady && !tourOn; if(animateContent && entriesReady) animateContent = false;
  if(revealObs){ revealObs.disconnect(); revealObs=null; }
  const nToday = todayNotes().length;
  let followCls = ' ghost', followText = '…';           // reserved slot until data is ready
  if(entriesReady){
    followText = !authed ? 'Masuk dulu, ya. Jurnalmu cuma bisa dibuka olehmu.'
      : nToday===0 ? 'Kamu belum menulis hari ini. Cerita dulu sedikit, ya.' : `Hari ini sudah ada ${nToday} catatan. Mau nambah lagi?`;
    followCls = nudgeShown ? '' : ' late'; nudgeShown = true;
  }
  const dateLabel = new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
  document.getElementById('app').innerHTML = `
    <header class="hero${authed ? ' compact' : ''}">
      <div class="topbar">
        <div class="topbar-brand">
          <img src="${LOGO_URI}" alt="Logo Azzifa" width="28" height="28">
          <span class="brand-word">Azzifa</span>
          <span class="date">${dateLabel}</span>
        </div>
        <div class="topbar-actions">
          ${authed ? `<div class="streak-pill" title="${checkins} dari 7 hari terakhir"><span class="fire">🔥</span> <b>${checkins}</b>/7 hari</div>` : ''}
          <button class="icon-btn" onclick="toggleTheme()" title="Ganti tema" aria-label="Ganti tema">${getTheme()==='dark'?ICONS.sun:ICONS.moon}</button>
        </div>
      </div>
      <div class="hero-grid">
      <div class="hero-copy">
        <span class="eyebrow">Jurnal &amp; mood harian</span>
        <h1 class="hero-h">Teman Refleksi Harian di <span class="brand-name">Azzifa</span></h1>
        <p class="hero-sub">A Zone of Zen, Introspection, Feelings &amp; Affection.</p>
      </div>
      <div class="chat">
        <img class="chat-avatar${intro}" src="${LOGO_URI}" alt="" width="38" height="38">
        <div class="chat-stack">
          <div class="chat-bubble${intro}">
            <div class="chat-name">Azzifa</div>
            <div class="chat-text">${getGreeting()}${authed ? ' '+followText : ''}</div>
          </div>
          ${authed ? '' : `<div class="chat-bubble${followCls}"${followCls===' late' ? ` style="animation-delay:${intro?'.85s':'.15s'}"` : ''}${followCls===' ghost' ? ' aria-hidden="true"' : ''}><div class="chat-text">${followText}</div></div>`}
        </div>
      </div>
      </div>
      ${authed ? `<nav class="tabs" aria-label="Menu utama">
        <button class="${tab==='today'?'active':''}"${tab==='today'?' aria-current="page"':''} onclick="setTab('today')">Hari ini</button>
        <button class="${tab==='trend'?'active':''}"${tab==='trend'?' aria-current="page"':''} onclick="setTab('trend')">Dashboard</button>
        <button class="${tab==='history'?'active':''}"${tab==='history'?' aria-current="page"':''} onclick="setTab('history')">Riwayat</button>
        <button class="${tab==='profile'?'active':''}"${tab==='profile'?' aria-current="page"':''} onclick="setTab('profile')">Profil</button>
      </nav>` : ''}
    </header>
    <main class="content tab-${authed ? tab : 'auth'}">
      ${!authed ? renderAuth() : tab==='today' ? renderToday() : tab==='trend' ? renderTrend() : tab==='history' ? renderHistory() : renderProfile()}
    </main>
  `;
  renderMicButtons();
  if(animate) armReveal();
  if(tourOn) placeTour();
}
initStorage();
</script>
