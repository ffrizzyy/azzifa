<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){
  try{
    var saved = localStorage.getItem('azzifa_theme');
    var theme = saved === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Azzifa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Structure follows the Kitabisa reference (white pill bar, centred heading, floating white
     card, full-width pill CTA with chevron, icon grid), kept in Azzifa's own pink palette.
     One typeface throughout; hierarchy comes from weight, size and colour. */
  :root{
    --paper:#FBEEE9; --paper-dim:#F4DFD9; --card:#FFFDFB; --float:#FFFDFB;
        --ink:#3A222B; --ink-soft:#8A6B74;
    --rose:#D6456E; --clay:#D6456E; --line:#ECD3CC; --hover:rgba(255,255,255,.55);
    --shadow-card:0 20px 44px -28px rgba(58,34,43,.30), 0 2px 6px rgba(58,34,43,.05);
    --shadow-float:0 14px 30px -18px rgba(58,34,43,.30);
    --r-card:24px; --r-inner:18px; --r-pill:999px; --r-input:16px; --ease:cubic-bezier(.32,.72,0,1);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --paper:#26181C; --paper-dim:#35232A; --card:#302027; --float:#46303A;
        --ink:#F7E6ED; --ink-soft:#B99AA2;
    --rose:#E0447E; --clay:#E0447E; --line:#4A3239; --hover:rgba(255,255,255,.07);
    --shadow-card:0 20px 44px -28px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.2);
    --shadow-float:0 14px 30px -18px rgba(0,0,0,.6);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scrollbar-gutter:stable;}
  html,body{height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Plus Jakarta Sans',sans-serif; -webkit-font-smoothing:antialiased;}
  button, input, textarea{font-family:inherit;}
  .app{max-width:480px; margin:0 auto; padding:0 0 60px; min-height:100%; animation:settle .6s var(--ease) both;}
  @keyframes settle{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

  /* ---- Hero (tinted block, rounded bottom) ---- */
  .hero{padding:16px 20px 24px;}
  .topbar{display:flex; align-items:center; gap:8px; background:var(--float); border-radius:var(--r-pill); padding:7px 8px 7px 12px; box-shadow:var(--shadow-float);}
  .topbar-brand{display:flex; align-items:center; gap:9px; min-width:0; flex:1;}
  .topbar-brand img{width:28px; height:28px; flex-shrink:0; display:block;}
  .date{font:700 13px 'Plus Jakarta Sans',sans-serif; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .streak-pill{display:inline-flex; align-items:center; gap:5px; background:var(--paper-dim); padding:6px 10px; border-radius:var(--r-pill); font:600 12px 'Plus Jakarta Sans',sans-serif; color:var(--ink-soft); white-space:nowrap;}
  .streak-pill b{color:var(--clay); font-size:13px;}
  .fire{display:inline-block;}
  .icon-btn{flex-shrink:0; width:34px; height:34px; border-radius:50%; border:none; background:var(--paper-dim); color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .icon-btn.on{background:var(--clay); color:#fff;}
  .hero-h{margin:26px 0 10px; font-weight:800; font-size:28px; line-height:1.18; letter-spacing:-0.02em; text-align:center; color:var(--ink);}
  .brand-name{display:inline-block; padding:0 .3em .08em; border-radius:.4em; background:var(--clay); color:#fff;}
  .hero-sub{margin:0 auto 24px; max-width:30ch; font-weight:500; font-size:15px; line-height:1.5; text-align:center; color:var(--ink-soft);}

  /* ---- Chat bubble: left aligned, with avatar and name ---- */
  .chat{display:flex; align-items:flex-end; gap:10px; margin:0 0 20px;}
  .chat-avatar{flex-shrink:0; width:36px; height:36px; padding:6px; border-radius:50%; background:var(--float); object-fit:contain; box-shadow:var(--shadow-float);}
  .chat-bubble{min-width:0; max-width:100%; background:var(--float); border-radius:18px 18px 18px 6px; padding:10px 15px 12px; box-shadow:var(--shadow-float);}
  .chat-stack{display:flex; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; max-width:calc(100% - 48px);}
  .chat-stack .chat-bubble:not(:last-child){border-bottom-left-radius:8px;}
  .chat-stack .chat-bubble:not(:first-child){border-top-left-radius:8px;}
  .chat-bubble.late{transform-origin:0 100%; animation:bubbleIn .5s var(--ease) both;}
  .chat-name{font:700 11.5px 'Plus Jakarta Sans',sans-serif; color:var(--clay); margin-bottom:2px;}
  .chat-text{font:500 14.5px/1.55 'Plus Jakarta Sans',sans-serif; color:var(--ink);}
  .chat-bubble.intro{transform-origin:0 100%; animation:bubbleIn .55s var(--ease) .3s both;}
  .chat-avatar.intro{animation:bubbleIn .45s var(--ease) .2s both;}
  @keyframes bubbleIn{from{opacity:0; transform:translateY(8px) scale(.94);} to{opacity:1; transform:none;}}

  /* ---- Tabs: white pill, active tab is the accent pill ---- */
  .tabs{display:flex; gap:4px; background:var(--float); border-radius:var(--r-pill); padding:4px; box-shadow:var(--shadow-float);}
  .tabs button{flex:1; border:none; background:transparent; padding:11px 4px; border-radius:var(--r-pill); font:600 14px 'Plus Jakarta Sans',sans-serif; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .tabs button.active{background:var(--clay); color:#fff; box-shadow:0 10px 18px -10px var(--clay);}

  /* ---- Content: first card floats over the hero edge ---- */
  .content{padding:0 20px;}
  .card{background:var(--card); border-radius:var(--r-card); padding:20px; margin-bottom:16px; box-shadow:var(--shadow-card);}
  .section-h{margin:0 0 16px; font-weight:700; font-size:18px; line-height:1.3; letter-spacing:-0.01em; color:var(--ink);}

  /* ---- Mood: circular icon grid with labels underneath ---- */
  .mood-card{padding:20px 12px 14px;}
  .mood-card .section-h{padding:0 8px;}
  .mood-row{display:grid; grid-template-columns:repeat(5,1fr); gap:4px;}
  .mood{background:none; border:none; cursor:pointer; padding:6px 2px 8px; border-radius:16px; text-align:center;}
  .mood .emoji{display:flex; align-items:center; justify-content:center; width:min(56px,100%); aspect-ratio:1; font-size:28px; border-radius:50%; margin:0 auto 8px;}
  .mood .lbl{display:block; font-size:12.5px; font-weight:500; color:var(--ink);}
  .mood.sel .emoji{animation:pop .35s var(--ease) both; box-shadow:0 0 0 2px var(--card), 0 0 0 4px var(--clay);}
  @keyframes pop{0%{transform:scale(1);} 45%{transform:scale(1.2);} 100%{transform:scale(1.06);}}

  /* ---- Writing card ---- */
  .prompt-label{font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:6px;}
  .prompt-text{margin:0; font-weight:700; font-size:19px; line-height:1.4; letter-spacing:-0.01em;}
  .swap{background:none; border:none; color:var(--rose); font:600 13px 'Plus Jakarta Sans',sans-serif; cursor:pointer; padding:0; margin-top:10px;}
  .field-row{display:flex; gap:8px; margin-top:14px; align-items:flex-start;}
  textarea{flex:1; width:100%; min-height:130px; border:1px solid var(--line); border-radius:var(--r-input); padding:14px; font:400 15px/1.6 'Plus Jakarta Sans',sans-serif; color:var(--ink); resize:vertical; background:var(--paper);}
  textarea:focus{outline:2px solid var(--rose); outline-offset:1px;}
  .mic-btn{flex-shrink:0; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .mic-btn.on{background:var(--clay); border-color:var(--clay); color:#fff;}
  .save{position:relative; width:100%; height:54px; margin-top:16px; background:var(--clay); color:#fff; border:none; border-radius:var(--r-pill); font:700 16px 'Plus Jakarta Sans',sans-serif; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 12px 22px -12px var(--clay);}
  .save .chev{position:absolute; right:18px; top:50%; margin-top:-9px; display:flex;}

  /* ---- Reminder panel (opens from the bell) ---- */
  /* ---- Reminder popover: anchored under the bell, floats over content, closes on outside click or Escape ---- */
  .topbar{position:relative; z-index:10;}
  .popover{position:absolute; top:calc(100% + 12px); right:0; width:min(320px,100%); background:var(--float); border-radius:var(--r-inner); padding:16px; font-size:13.5px; box-shadow:0 24px 48px -16px rgba(58,34,43,.38), 0 2px 8px rgba(58,34,43,.08); transform-origin:calc(100% - 65px) 0;}
  .popover::before{content:""; position:absolute; top:-6px; right:59px; width:12px; height:12px; background:var(--float); border-radius:3px 0 0 0; transform:rotate(45deg);}
  .popover.enter{animation:popIn .28s var(--ease) both;}
  @keyframes popIn{from{opacity:0; transform:translateY(-6px) scale(.96);} to{opacity:1; transform:none;}}
  .popover-row{display:flex; align-items:center; justify-content:space-between; gap:14px;}
  .popover-row + .popover-row{margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .popover-title{font-weight:700; font-size:14.5px;}
  .popover-hint{margin-top:3px; max-width:24ch; font-size:12px; line-height:1.45; color:var(--ink-soft); text-wrap:pretty;}
  .popover input[type=time]{border:1px solid var(--line); border-radius:12px; padding:6px 10px; font:500 13px 'Plus Jakarta Sans',sans-serif; background:var(--paper); color:var(--ink);}
  .popover-note{margin-top:12px; font-size:12px; color:var(--ink-soft);}
  .switch{position:relative; width:38px; height:22px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--line); border-radius:22px; cursor:pointer; transition:.2s;}
  .slider:before{content:""; position:absolute; width:16px; height:16px; left:3px; top:3px; background:#fff; border-radius:50%; transition:.2s;}
  input:checked + .slider{background:var(--rose);}
  input:checked + .slider:before{transform:translateX(16px);}

  /* ---- Dashboard ---- */
  .stats{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
  .stat{flex:1; min-width:90px; background:var(--card); border-radius:var(--r-inner); padding:14px 10px; text-align:center; box-shadow:var(--shadow-card);}
  .stat b{display:block; font-weight:700; font-size:19px;}
  .stat span{font-size:11px; color:var(--ink-soft);}
  /* Mode switch (Check Up / Harian): its own component — this is a top-level choice about how
     you write today, not a data filter, so it should not look like the Dashboard's date-range pills. */
  .mode-switch{display:flex; gap:8px; margin-bottom:8px;}
  .mode-switch button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:46px; border-radius:var(--r-inner); border:1.5px solid var(--line); background:var(--card); color:var(--ink-soft); font:600 13.5px 'Plus Jakarta Sans',sans-serif; cursor:pointer;}
  .mode-switch button.active{border-color:var(--clay); background:var(--clay); color:#fff; box-shadow:0 10px 20px -12px var(--clay);}
  .mode-hint{margin:0 0 16px; font-size:12px; line-height:1.5; color:var(--ink-soft);}

  /* Ghost pill: small secondary action with an icon — "Ganti pertanyaan", "Batal mengubah" */
  .btn-ghost-sm{display:inline-flex; align-items:center; gap:6px; margin-top:10px; padding:7px 14px; border-radius:var(--r-pill); border:1px solid var(--line); background:transparent; color:var(--ink); font:600 12.5px 'Plus Jakarta Sans',sans-serif; cursor:pointer;}

  /* Row action: small icon-only button riding on a note's own header — "Ubah", "Hapus" */
  .row-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .icon-ghost{flex-shrink:0; width:28px; height:28px; border-radius:50%; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}

  .range-toggle{display:flex; gap:6px; margin-bottom:16px;}
  .range-toggle button{border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:7px 16px; font:600 12.5px 'Plus Jakarta Sans',sans-serif; color:var(--ink-soft); cursor:pointer;}
  .range-toggle button.active{background:var(--clay); color:#fff; border-color:var(--clay);}
  .chart-summary{font-size:13.5px; color:var(--ink-soft); margin-top:14px; line-height:1.5;}
  .chart-draw{animation:reveal .7s var(--ease) both;}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0);} to{clip-path:inset(0 0 0 0);}}
  .insight-box{background:var(--paper-dim); border-radius:16px; padding:14px; margin-top:14px; font-size:13.5px; line-height:1.6;}
  .insight-box .lbl{font-size:11px; color:var(--ink-soft); margin-bottom:6px;}

  /* ---- History ---- */
  .actions{display:flex; gap:8px; margin-bottom:16px;}
  .actions button{flex:1; border:1px solid var(--line); background:var(--card); border-radius:var(--r-pill); padding:11px; font:600 13px 'Plus Jakarta Sans',sans-serif; color:var(--ink); cursor:pointer;}
  .entry{border-bottom:1px solid var(--line); padding:16px 2px;}
  .entry:last-child{border-bottom:none; padding-bottom:0;}
  .entry-head{display:flex; align-items:center; gap:8px; margin-bottom:6px;}
  .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .entry-date{font-size:12.5px; color:var(--ink-soft);}
  .entry-prompt{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:5px; flex:1; min-width:0;}
  .entry-text{font-size:15px; line-height:1.5;}
  .empty{text-align:center; padding:50px 10px; color:var(--ink-soft); line-height:1.6;}
  .empty svg{display:block; margin:0 auto;}

  /* ---- Toast ---- */
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(10px) scale(.96); background:var(--ink); color:var(--paper); padding:10px 18px; border-radius:var(--r-pill); font-size:13.5px; opacity:0; transition:opacity .3s var(--ease), transform .3s var(--ease); pointer-events:none; z-index:20; max-width:90%; text-align:center;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}

  /* ---- Type polish ---- */
  .hero-h{text-wrap:balance;}
  .hero-sub, .chat-text, .prompt-text, .chart-summary, .insight-box{text-wrap:pretty;}
  .stat b, .streak-pill b{font-variant-numeric:tabular-nums;}

  /* ---- Transitions on every interactive element ---- */
  .tabs button, .mood, .mood .emoji, .mood .lbl, .save, .save .chev, .icon-btn, .mic-btn, .actions button, .range-toggle button, .mode-switch button, .btn-ghost-sm, .icon-ghost, .stat, .dot, .entry-date, .topbar-brand img{
    transition:transform .25s var(--ease), color .25s var(--ease), background-color .25s var(--ease), border-color .25s var(--ease), box-shadow .25s var(--ease);}
  .swap{background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat; transition:background-size .3s var(--ease);}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(0);} 30%{transform:scale(1.22) rotate(-7deg);} 60%{transform:scale(1.1) rotate(6deg);}}

  /* ---- Hover: pointer devices only, so touch screens never get a stuck hover ---- */
  @media (hover:hover) and (pointer:fine){
    .tabs button:not(.active):hover{color:var(--ink); background:var(--paper-dim);}
    .mood:not(.sel):hover{background:var(--paper);}
    .mood:not(.sel):hover .emoji{transform:translateY(-3px) scale(1.06);}
    .save:hover{transform:translateY(-2px); box-shadow:0 16px 28px -14px var(--clay);}
    .save:hover .chev{transform:translateX(3px);}
    .icon-btn:not(.on):hover{color:var(--clay); transform:translateY(-1px);}
    .actions button:hover, .mic-btn:not(.on):hover{border-color:var(--clay); color:var(--clay); transform:translateY(-1px);}
    .range-toggle button:not(.active):hover{border-color:var(--clay); color:var(--clay);}
    .mode-switch button:not(.active):hover{border-color:var(--clay); color:var(--clay);}
    .btn-ghost-sm:hover{border-color:var(--clay); color:var(--clay);}
    .icon-ghost:hover{background:var(--paper-dim); color:var(--clay);}
    .stat:hover{transform:translateY(-2px);}
    .entry:hover .dot{transform:scale(1.5);}
    .entry:hover .entry-date{color:var(--ink);}
    .topbar-brand img:hover{transform:rotate(-8deg) scale(1.1);}
    .streak-pill:hover .fire{animation:flicker .6s ease-in-out;}
    .swap:hover{background-size:100% 1px;}
    /* pressed state must beat hover, otherwise a click keeps the lifted pose */
    .save:active{transform:translateY(0) scale(.98);}
    .icon-btn:active, .mic-btn:active, .actions button:active, .mode-switch button:active, .btn-ghost-sm:active, .icon-ghost:active{transform:scale(.96);}
  }
  .tabs button:active, .mood:active{transform:scale(.96);}

  /* ---- Keyboard focus (accessibility, not optional) ---- */
  button:focus-visible, input:focus-visible{outline:2px solid var(--rose); outline-offset:2px;}
  .tabs button.active:focus-visible, .save:focus-visible, .icon-btn.on:focus-visible{outline-color:var(--ink);}
  .switch input:focus-visible + .slider{outline:2px solid var(--rose); outline-offset:2px;}

  /* ---- Skeleton loading state for the weekly insight ---- */
  .skeleton span{display:block; position:relative; overflow:hidden; height:10px; border-radius:6px; margin-bottom:8px; background:var(--line);}
  .skeleton span.short{width:60%; margin-bottom:0;}
  .skeleton span::after{content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, var(--hover), transparent); animation:sweep 1.4s var(--ease) infinite;}
  @keyframes sweep{to{transform:translateX(100%);}}

  /* ---- Follow-up chat bubble keeps a fixed height so the tabs never jump between screens ---- */
  .chat-stack .chat-bubble:not(:first-child){min-height:67px; display:flex; align-items:center;}
  .chat-bubble.ghost{visibility:hidden;}

  /* ---- Notes written today ---- */
  .note{padding:14px 0; border-bottom:1px solid var(--line);}
  .note:first-of-type{padding-top:0;}
  .note:last-child{border-bottom:none; padding-bottom:0;}
  .note-q{margin-bottom:4px; font-size:12.5px; font-style:italic; color:var(--ink-soft);}
  .note-t{font-size:14.5px; line-height:1.5; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  .entry-text{white-space:pre-line;}
  .entry-text + .entry-prompt{margin-top:14px;}
  /* One day can hold several notes now — a lighter dashed rule marks the boundary between them,
     kept visually distinct from the solid rule .entry already uses to mark day boundaries. */
  .note-block.divider{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
  .confirm-row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:12.5px; color:var(--ink-soft);}
  .btn-ghost-sm.danger{border-color:var(--rose); color:var(--rose);}
  @media (hover:hover) and (pointer:fine){ .btn-ghost-sm.danger:hover{background:var(--rose); color:#fff;} }

  /* ---- AI summary card (History) ---- */
  .summary .range-toggle{margin-bottom:14px;}
  .summary .skeleton{margin-bottom:14px;}
  .summary-hint{margin:0; font-size:13.5px; line-height:1.55; color:var(--ink-soft);}
  .summary-text{margin:0 0 6px; font-size:14.5px; line-height:1.65; white-space:pre-line;}
  .summary-meta{margin:0 0 14px; font-size:12px; color:var(--ink-soft);}
  .summary-err{margin:0 0 12px; font-size:13px; color:var(--rose);}
  .summary-privacy{margin:10px 0 0; font-size:11.5px; line-height:1.5; color:var(--ink-soft);}
  .progress{height:8px; margin-top:14px; border-radius:var(--r-pill); background:var(--paper-dim); overflow:hidden;}
  .progress span{display:block; height:100%; border-radius:var(--r-pill); background:var(--clay);}
  .btn-soft{width:100%; height:48px; border-radius:var(--r-pill); border:1.5px solid var(--clay); background:transparent; color:var(--clay); font:700 14.5px 'Plus Jakarta Sans',sans-serif; cursor:pointer; transition:transform .25s var(--ease), background-color .25s var(--ease), color .25s var(--ease);}
  .btn-soft:disabled{opacity:.55; cursor:default;}
  .btn-soft:active:not(:disabled){transform:scale(.98);}
  @media (hover:hover) and (pointer:fine){ .btn-soft:not(:disabled):hover{background:var(--clay); color:#fff;} }

  /* ---- Print report ---- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px;}
  }

  /* ---- One global switch for people who ask for less motion ---- */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *, *::before, *::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>

}
function persistProfile(patch){

    .catch(()=>showToast('Gagal menyimpan pengaturan ke server'));
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function setDayMode(m){ if(dayMode===m) return; dayMode=m; persistProfile({dayMode:m}); render(); }
async function persistEntry(entry){
  const res = await fetch(`/api/entries/${entry.date}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entry)});
  if(!res.ok) throw new Error('bad status');
}
async function deleteEntryDoc(date){

function askDeleteNote(date, idx){ confirmDeleteKey = date+'::'+idx; render(); }
function cancelDeleteNote(){ confirmDeleteKey = null; render(); }
// No window.confirm() here on purpose — Claude's published-artifact iframe blocks native dialogs
// (no `allow-modals`), so confirm() returns falsy instantly and the delete silently never fires.
// This is an in-page two-step confirm instead: tap trash, a "Ya, hapus / Batal" row replaces it.
async function deleteNote(date, idx){
  confirmDeleteKey = null;
  const existing = entries.find(e=>e.date===date);
  if(!existing) return;
  const notes = notesOf(existing).filter((_,i)=>i!==idx);
  try{
    if(notes.length===0){
      await deleteEntryDoc(date);
      entries = entries.filter(e=>e.date!==date);
    } else {
      const entry = {...existing, notes, prompt:notes[0].prompt, text:notes.map(n=>n.text).join('\n\n'), updatedAt:Date.now()};
      await persistEntry(entry);
      entries = [...entries.filter(e=>e.date!==date), entry];
    }
  }catch(e){ showToast('Gagal menghapus, coba lagi'); return; }
  if(editingIdx!==null && date===todayStr()) cancelEdit();
  showToast('Catatan dihapus'); render();
}

function fmtDate(d){ return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }
function fmtShort(d){ return new Date(d).toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }
function moodInfo(k){ return MOODS.find(m=>m.k===k) || MOODS[2]; }
function hasEntryToday(){ return !!entries.find(e=>e.date===todayStr()); }
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// A day can hold several notes. Older entries (one prompt + one text) are read as a single note.
function notesOf(e){ return Array.isArray(e.notes) && e.notes.length ? e.notes : [{prompt:e.prompt||'', text:e.text||'', at:e.updatedAt||0}]; }
function textOf(e){ return notesOf(e).map(n=>n.text).join('\n\n'); }
function todayNotes(){ const e=entries.find(x=>x.date===todayStr()); return e?notesOf(e):[]; }

function pickPrompt(notes){
  const used=new Set((notes||todayNotes()).map(n=>n.prompt));
  const all=PROMPTS.map((_,i)=>i).filter(i=>i!==promptIdx);
  const fresh=all.filter(i=>!used.has(PROMPTS[i]));
  const pool=fresh.length?fresh:all;
  return pool[Math.floor(Math.random()*pool.length)];
}

function rollingCheckins(n=7){
  const days=new Set(entries.map(e=>e.date));
  let count=0;
  for(let i=0;i<n;i++){ const d=new Date(); d.setDate(d.getDate()-i); if(days.has(d.toISOString().slice(0,10))) count++; }
  return count;
}
function longestStreakEver(){
  const sortedDays=[...new Set(entries.map(e=>e.date))].sort();
  let longest=0,current=0,prev=null;
  sortedDays.forEach(d=>{
    current = prev && (new Date(d)-new Date(prev))/86400000===1 ? current+1 : 1;
    longest=Math.max(longest,current); prev=d;
  });
  return longest;
}
function entriesThisMonth(){ const ym=todayStr().slice(0,7); return entries.filter(e=>e.date.startsWith(ym)).reduce((n,e)=>n+notesOf(e).length,0); }
function hardestDayInfo(){
  const buckets={}; const dayNames=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  entries.forEach(e=>{
    const d=new Date(e.date).getDay(); const v=MOOD_ORDER.indexOf(e.mood)+1;
    if(!buckets[d]) buckets[d]={sum:0,count:0};
    buckets[d].sum+=v; buckets[d].count++;
  });
  let worst=null;
  Object.entries(buckets).forEach(([d,b])=>{ const avg=b.sum/b.count; if(!worst||avg<worst.avg) worst={day:dayNames[d],avg}; });
  return worst;
}

let recognizer=null, micTarget=null, micActive=false, micIntentionalStop=false;
function getRecognizer(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  if(!recognizer){
    recognizer=new SR(); recognizer.lang='id-ID'; recognizer.continuous=true; recognizer.interimResults=true;
    recognizer.onresult=(ev)=>{
      let finalText='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){ if(ev.results[i].isFinal) finalText+=ev.results[i][0].transcript; }
      if(finalText && micTarget){
        const el=document.getElementById(micTarget);
        if(el){ el.value += (el.value?' ':'')+finalText.trim(); if(micTarget==='entryText') draftText=el.value; }
      }
    };
    recognizer.onerror=(ev)=>{
      if(ev.error==='not-allowed' || ev.error==='service-not-allowed'){
        micIntentionalStop=true; showToast('Izin mikrofon ditolak — aktifkan lewat pengaturan browser');
      } else if(ev.error!=='no-speech'){
        micIntentionalStop=true; showToast('Input suara terganggu, coba lagi');
      }
      // 'no-speech' is harmless — onend will decide whether to keep listening
    };
    recognizer.onend=()=>{
      if(micActive && !micIntentionalStop){
        try{ recognizer.start(); return; }catch(e){}
      }
      micActive=false; micTarget=null; renderMicButtons();
    };
  }
  return recognizer;
}
function renderMicButtons(){
  document.querySelectorAll('.mic-btn').forEach(b=>{
    b.classList.toggle('on', micActive && b.dataset.target===micTarget);
  });
}
function toggleMic(targetId){
  const r=getRecognizer();
  if(!r){ showToast('Input suara tidak didukung di browser ini'); return; }
  const el=document.getElementById(targetId);
  if(micActive && micTarget===targetId){
    micIntentionalStop=true; micActive=false; micTarget=null; r.stop();
  } else {
    if(micActive){ micIntentionalStop=true; r.stop(); }
    micIntentionalStop=false; micTarget=targetId; micActive=true;
    if(targetId==='entryText') draftText = el?el.value:draftText;
    try{ r.start(); }catch(e){}
  }
  renderMicButtons();
}

async function saveEntry(){

function seriesForRange(n){
  const byDate={}; entries.forEach(e=>byDate[e.date]=e);
  const days=[];
  for(let i=n-1;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const s=d.toISOString().slice(0,10); const e=byDate[s];
    days.push({date:s, value: e?MOOD_ORDER.indexOf(e.mood)+1:null, mood: e?e.mood:null}); }
  return days;
}
function setRange(n){ chartRange=n; render(); }
function renderChartSVG(days){
  const w=440,h=160,padL=28,padR=10,padT=10,padB=24, innerW=w-padL-padR, innerH=h-padT-padB, stepX=innerW/(days.length-1||1);
  const yFor=v=>padT+innerH-((v-1)/4)*innerH;
  let segments=[],current=[];
  days.forEach((d,i)=>{ const x=padL+i*stepX; if(d.value===null){ if(current.length){segments.push(current);current=[];} } else current.push({x,y:yFor(d.value)}); });
  if(current.length) segments.push(current);
  const pathFor=seg=>'M'+seg.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
  const gridLines=[1,2,3,4,5].map(v=>`<line x1="${padL}" y1="${yFor(v)}" x2="${w-padR}" y2="${yFor(v)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const emojiLabels=MOODS.map((m,i)=>`<text x="${padL-8}" y="${yFor(i+1)+4}" font-size="10" text-anchor="end">${m.e}</text>`).join('');
  const xLabels=days.map((d,i)=>{ const show=days.length<=7||i%Math.ceil(days.length/6)===0||i===days.length-1; if(!show) return '';
    return `<text x="${(padL+i*stepX).toFixed(1)}" y="${h-6}" font-size="9.5" text-anchor="middle" fill="var(--ink-soft)">${fmtShort(d.date)}</text>`; }).join('');
  const lines=segments.map(seg=>`<path d="${pathFor(seg)}" fill="none" stroke="var(--rose)" stroke-width="2"/>`).join('');
  const dots=days.filter(d=>d.value!==null).map(d=>{ const i=days.indexOf(d); const x=padL+i*stepX; const y=yFor(d.value);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${moodInfo(d.mood).c}"/>`; }).join('');
  return `<div class="chart-draw"><svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${gridLines}${emojiLabels}${lines}${dots}${xLabels}</svg></div>`;
}
function weekKey(){
  const d=new Date(); const day=(d.getDay()+6)%7; // Monday=0
  d.setDate(d.getDate()-day);
  return d.toISOString().slice(0,10); // this week's Monday
}

        ${insightLoading ? '<div class="skeleton" role="status" aria-label="Menganalisis pola"><span></span><span></span><span class="short"></span></div>' : (dashboardInsight || (totalNotes()<3 ? 'Isi minimal 3 catatan agar pengamatan bisa dibuat.' : 'Belum tersedia.'))}
      </div>
    </div>
  `;
}

// ---------- History + export ----------
function exportTxt(){
  if(entries.length===0){ showToast('Belum ada catatan untuk diekspor'); return; }
  window.location.href = '/api/export.txt';
}
function printReport(){
  if(entries.length===0){ showToast('Belum ada catatan untuk dicetak'); return; }
  const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('printArea').innerHTML = `
    <h2 style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:700;">Azzifa — Catatan Refleksi</h2>
    <p style="color:#555; font-size:13px;">Diekspor ${fmtDate(todayStr())} · ${totalNotes()} catatan</p>
    ${summaryText ? `<div style="margin-bottom:16px; padding:12px; border:1px solid #ddd; white-space:pre-line; font-size:13.5px; line-height:1.5;"><b>Rangkuman kegiatan (${summaryRange} hari terakhir)</b>\n${esc(summaryText)}</div>` : ''}
    ${sorted.map(e=>`<div style="margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #ddd;">
      <div style="font-size:13px; color:#555;">${fmtDate(e.date)} — Mood: ${moodInfo(e.mood).l}</div>
      ${notesOf(e).map(n=>`<div style="font-size:12.5px; font-style:italic; color:#666; margin:6px 0 2px;">${esc(n.prompt)}</div><div style="font-family:'Plus Jakarta Sans',sans-serif; font-size:14px; line-height:1.5; white-space:pre-line;">${esc(n.text)}</div>`).join('')}
    </div>`).join('')}`;
  window.print();
}
// ---------- AI summary of daily activities (History tab) ----------
const SUMMARY_MIN_NOTES = 3;
function setSummaryRange(n){ summaryRange=n; render(); }
async function generateSummary(){
  if(summaryLoading) return;
  summaryLoading=true; summaryErr=null; render();
  try{
    const res = await fetch('/api/summary', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({range:summaryRange})});
    const data = await res.json();
    if(!res.ok){ summaryErr = data.error || 'Gagal membuat rangkuman. Coba lagi sebentar lagi.'; }
    else{ summaryText = data.text; summaryAt = data.at; }
  }catch(e){ summaryErr = 'Tidak bisa menghubungi server.'; }
  summaryLoading=false; render();
}
function renderSummaryCard(){
  const n=totalNotes();
  if(n<SUMMARY_MIN_NOTES){
    const left=SUMMARY_MIN_NOTES-n;
    return `<div class="card summary">
      <h2 class="section-h">Rangkuman kegiatan</h2>
      <p class="summary-hint">Tulis ${left} catatan lagi, lalu Azzifa bisa merangkum kegiatanmu.</p>
      <div class="progress" role="progressbar" aria-label="Catatan menuju rangkuman" aria-valuemin="0" aria-valuemax="${SUMMARY_MIN_NOTES}" aria-valuenow="${n}"><span style="width:${Math.round(n/SUMMARY_MIN_NOTES*100)}%"></span></div>
    </div>`;
  }
  return `<div class="card summary" aria-busy="${summaryLoading}">
    <h2 class="section-h">Rangkuman kegiatan</h2>
    <div class="range-toggle">
      <button class="${summaryRange===7?'active':''}" onclick="setSummaryRange(7)">7 hari terakhir</button>
      <button class="${summaryRange===30?'active':''}" onclick="setSummaryRange(30)">30 hari terakhir</button>
    </div>
    ${summaryLoading
      ? '<div class="skeleton" role="status" aria-label="Membuat rangkuman"><span></span><span></span><span></span><span class="short"></span></div>'
      : (summaryText
          ? `<p class="summary-text">${esc(summaryText)}</p><p class="summary-meta">Dibuat ${fmtDate(summaryAt)}</p>`
          : `<p class="summary-hint">Ringkas kegiatanmu dari catatan yang sudah kamu tulis.</p>`)}
    ${summaryErr ? `<p class="summary-err" role="alert">${esc(summaryErr)}</p>` : ''}
    <button class="btn-soft" onclick="generateSummary()" ${summaryLoading?'disabled':''}>${summaryText?'Buat ulang rangkuman':'Rangkum kegiatanku'}</button>
    <p class="summary-privacy">Catatan pada rentang ini dikirim ke Claude untuk dirangkum.</p>
  </div>`;
}
function renderHistory(){
  if(entries.length===0) return `<div class="card empty">${EMPTY_ILLUSTRATION}<div style="margin-top:10px;">Belum ada catatan.<br>Mulai dari tab "Hari ini".</div></div>`;
  const sorted=[...entries].sort((a,b)=>b.date.localeCompare(a.date));
  const idxs=sorted.map(e=>MOOD_ORDER.indexOf(e.mood)).filter(i=>i>=0);
  const avgLabel=MOOD_ORDER[Math.round(idxs.reduce((a,b)=>a+b,0)/idxs.length)]||'biasa';
  return `
    <div class="stats">
      <div class="stat"><b>${totalNotes()}</b><span>Total catatan</span></div>
      <div class="stat"><b>${moodInfo(avgLabel).e}</b><span>Rata-rata mood</span></div>
    </div>
    ${renderSummaryCard()}
    <div class="actions"><button onclick="exportTxt()">Ekspor .txt</button><button onclick="printReport()">Cetak / PDF</button></div>
    <div class="card">
      <h2 class="section-h">Catatan yang sudah kamu tulis</h2>
      ${sorted.map(e=>{ const ns=notesOf(e); return `<div class="entry">
        <div class="entry-head"><span class="dot" style="background:${moodInfo(e.mood).c}"></span><span class="entry-date">${fmtDate(e.date)} · ${moodInfo(e.mood).l}${ns.length>1?` · ${ns.length} catatan`:''}</span></div>
        ${ns.map((n,i)=>{
          const pendingDelete = confirmDeleteKey===(e.date+'::'+i);
          return `<div class="note-block${i>0?' divider':''}">
            <div class="row-head">
              <div class="entry-prompt">${esc(n.prompt)}</div>
              ${pendingDelete ? '' : `<button class="icon-ghost" onclick="askDeleteNote('${e.date}', ${i})" title="Hapus catatan" aria-label="Hapus catatan">${ICONS.trash}</button>`}
            </div>
            <div class="entry-text">${esc(n.text)}</div>
            ${pendingDelete ? `<div class="confirm-row">
              <span>Hapus catatan ini?</span>
              <button class="btn-ghost-sm danger" onclick="deleteNote('${e.date}', ${i})">Ya, hapus</button>
              <button class="btn-ghost-sm" onclick="cancelDeleteNote()">Batal</button>
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>`; }).join('')}
    </div>
  `;
}

function render(){
  const checkins=rollingCheckins(7);
  const intro = introPlayed ? '' : ' intro'; introPlayed = true;
  const pfresh = popoverFresh; popoverFresh = false;
  const nToday = todayNotes().length;
  let followCls = ' ghost', followText = '…';           // reserved slot until data is ready
  if(entriesReady){
    followText = nToday===0 ? 'Kamu belum check-in hari ini. Mulai dari perasaanmu dulu, ya.' : `Hari ini sudah ada ${nToday} catatan. Mau nambah lagi?`;
    followCls = nudgeShown ? '' : ' late'; nudgeShown = true;
  }
  const dateLabel = new Date().toLocaleDateString('id-ID',{weekday:'short',day:'numeric',month:'short'});
  document.getElementById('app').innerHTML = `
    <header class="hero">
      <div class="topbar">
        <div class="topbar-brand">
          <img src="${LOGO_URI}" alt="Logo Azzifa" width="28" height="28">
          <span class="date">${dateLabel}</span>
        </div>
        <div class="topbar-actions">
          <div class="streak-pill" title="${checkins} dari 7 hari terakhir"><span class="fire">🔥</span> <b>${checkins}</b>/7 hari</div>
          <button class="icon-btn bell-btn${showSettings?' on':''}" onclick="openSettings()" title="Pengingat" aria-label="Pengingat harian" aria-expanded="${showSettings}">${ICONS.bell}</button>
          <button class="icon-btn" onclick="toggleTheme()" title="Ganti tema" aria-label="Ganti tema">${getTheme()==='dark'?ICONS.sun:ICONS.moon}</button>
        </div>
        ${showSettings ? renderSettingsPanel(pfresh) : ''}
      </div>
      <h1 class="hero-h">Teman Refleksi Harian di <span class="brand-name">Azzifa</span></h1>
      <p class="hero-sub">A Zone of Zen, Introspection, Feelings &amp; Affection.</p>
      <div class="chat">
        <img class="chat-avatar${intro}" src="${LOGO_URI}" alt="" width="36" height="36">
        <div class="chat-stack">
          <div class="chat-bubble${intro}">
            <div class="chat-name">Azzifa</div>
            <div class="chat-text">${getGreeting()}</div>
          </div>
          <div class="chat-bubble${followCls}"${followCls===' late' ? ` style="animation-delay:${intro?'.85s':'.15s'}"` : ''}${followCls===' ghost' ? ' aria-hidden="true"' : ''}><div class="chat-text">${followText}</div></div>
        </div>
      </div>
      <nav class="tabs" aria-label="Menu utama">
        <button class="${tab==='today'?'active':''}" onclick="setTab('today')">Hari ini</button>
        <button class="${tab==='trend'?'active':''}" onclick="setTab('trend')">Dashboard</button>
        <button class="${tab==='history'?'active':''}" onclick="setTab('history')">Riwayat</button>
      </nav>
    </header>
    <main class="content">
      ${tab==='today' ? renderToday() : tab==='trend' ? renderTrend() : renderHistory()}
    </main>
  `;
  renderMicButtons();
}
initStorage();
</script>
</body>
</html>
