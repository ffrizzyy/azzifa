<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
(function(){
  try{
    var saved = localStorage.getItem('azzifa_theme');
    var theme = saved === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  }catch(e){}
})();
</script>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Azzifa</title>
<meta name="description" content="Azzifa — teman refleksi harian: jurnal, mood, dan streak bareng orang terdekat.">
<meta name="theme-color" content="#FAF4F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500;1,600&display=swap" rel="stylesheet">
<style>
  /* Soft Structuralism: near-white blush canvas, bold grotesk type, floating components with
     very diffuse ambient shadows. Every major surface is a "double bezel" — a translucent outer
     tray (the transparent border) holding an opaque inner core with its own hairline.
     One typeface throughout; hierarchy comes from weight, size and colour. */
  :root{
    --paper:#FAF4F2; --well:#F6ECE9; --paper-dim:#F2E4E0; --card:#FFFFFF; --float:#FFFFFF; --glass:rgba(255,255,255,.74);
    --ink:#2A1920; --ink-soft:#8B6F78;
    --rose:#D6456E; --clay:#D6456E; --rose-soft:rgba(214,69,110,.10); --gold:#D9A21B;
    --line:rgba(58,34,43,.10); --ring:rgba(58,34,43,.06); --shell:rgba(58,34,43,.04); --hi:rgba(255,255,255,.9);
    --hover:rgba(255,255,255,.55);
    --shadow-card:0 44px 80px -52px rgba(120,60,80,.38), 0 14px 32px -24px rgba(120,60,80,.16);
    --shadow-float:0 22px 44px -26px rgba(120,60,80,.34);
    --glow-a:rgba(214,69,110,.13); --glow-b:rgba(255,170,130,.17);
    --r-card:32px; --bezel:6px; --r-inner:22px; --r-pill:999px; --r-input:20px; --ease:cubic-bezier(.32,.72,0,1);
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  :root[data-theme="dark"]{
    --paper:#140D10; --well:#1B1216; --paper-dim:#2A1C22; --card:#20151A; --float:#2A1C22; --glass:rgba(36,24,29,.72);
    --ink:#F7E9EE; --ink-soft:#A98C95;
    --rose:#EC5A8C; --clay:#EC5A8C; --rose-soft:rgba(236,90,140,.14); --gold:#F0C04A;
    --line:rgba(255,255,255,.10); --ring:rgba(255,255,255,.08); --shell:rgba(255,255,255,.04); --hi:rgba(255,255,255,.07);
    --hover:rgba(255,255,255,.07);
    --shadow-card:0 44px 80px -52px rgba(0,0,0,.9), 0 14px 32px -24px rgba(0,0,0,.5);
    --shadow-float:0 22px 44px -26px rgba(0,0,0,.8);
    --glow-a:rgba(236,90,140,.16); --glow-b:rgba(255,150,110,.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth; scrollbar-gutter:stable;}
  html,body{min-height:100%;}
  body{margin:0; background:var(--paper); color:var(--ink); font-family:'Plus Jakarta Sans',sans-serif; -webkit-font-smoothing:antialiased;}
  /* Ambient light: fixed and non-interactive, so it never repaints while the page scrolls. */
  body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
    background:radial-gradient(60% 46% at 8% 0%, var(--glow-a), transparent 70%), radial-gradient(52% 44% at 100% 18%, var(--glow-b), transparent 70%), radial-gradient(60% 50% at 62% 112%, var(--glow-a), transparent 70%);}
  button, input, textarea{font-family:inherit;}
  /* Opacity only: a transform here would trap the fixed bottom nav inside .app. */
  .app{max-width:520px; margin:0 auto; padding:0 0 132px; min-height:100dvh; animation:settle .8s var(--ease) both;}
  @keyframes settle{from{opacity:0;} to{opacity:1;}}

  /* ---- Double bezel: transparent border = outer tray, padding-box fill = inner core ---- */
  .card, .stat{border:var(--bezel) solid transparent; background:linear-gradient(var(--card),var(--card)) padding-box, var(--shell) border-box;
    box-shadow:0 0 0 1px var(--ring), inset 0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), var(--shadow-card);}

  /* ---- Eyebrow tag ---- */
  .eyebrow{display:inline-flex; align-items:center; gap:6px; padding:5px 12px; border-radius:var(--r-pill); background:var(--rose-soft); color:var(--rose); font-size:10px; font-weight:700; line-height:1.4; letter-spacing:.2em; text-transform:uppercase;}

  /* ---- Hero ---- */
  .hero{padding:20px 16px 8px;}
  .topbar{position:relative; z-index:10; display:flex; align-items:center; gap:8px; background:var(--card); border-radius:var(--r-pill); padding:7px 8px 7px 12px; box-shadow:0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), var(--shadow-float);}
  .topbar-brand{display:flex; align-items:center; gap:9px; min-width:0; flex:1;}
  .topbar-brand img{width:28px; height:28px; flex-shrink:0; display:block;}
  .date{font:700 13px 'Plus Jakarta Sans',sans-serif; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .topbar-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
  .streak-pill{display:inline-flex; align-items:center; gap:5px; background:var(--well); padding:6px 11px; border-radius:var(--r-pill); font:600 12px 'Plus Jakarta Sans',sans-serif; color:var(--ink-soft); white-space:nowrap;}
  .streak-pill b{color:var(--clay); font-size:13px;}
  .fire{display:inline-block;}
  .icon-btn{flex-shrink:0; width:36px; height:36px; border-radius:50%; border:none; background:var(--well); color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .icon-btn.on{background:var(--clay); color:#fff;}
  .icon-btn:disabled{opacity:.35; cursor:default;}
  .hero-copy{margin:34px 4px 0;}
  .hero-h{margin:16px 0 14px; font-weight:800; font-size:clamp(34px,9.6vw,44px); line-height:1.04; letter-spacing:-0.04em; color:var(--ink); text-wrap:balance;}
  .brand-name{display:inline-block; padding:0 .28em .06em; border-radius:.34em; background:var(--clay); color:#fff; transform:rotate(-2deg); box-shadow:0 18px 30px -18px var(--clay);}
  .hero-sub{margin:0 0 28px; max-width:34ch; font-weight:500; font-size:15px; line-height:1.55; color:var(--ink-soft);}

  /* ---- Chat bubble: left aligned, with avatar and name ---- */
  .chat{display:flex; align-items:flex-end; gap:10px; margin:0 0 20px;}
  .chat-avatar{flex-shrink:0; width:38px; height:38px; padding:6px; border-radius:50%; background:var(--card); object-fit:contain; box-shadow:0 0 0 1px var(--ring), var(--shadow-float);}
  .chat-bubble{min-width:0; max-width:100%; background:var(--card); border-radius:22px 22px 22px 8px; padding:11px 16px 13px; box-shadow:0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), var(--shadow-float);}
  .chat-stack{display:flex; flex-direction:column; align-items:flex-start; gap:5px; min-width:0; max-width:calc(100% - 48px);}
  .chat-stack .chat-bubble:not(:last-child){border-bottom-left-radius:10px;}
  .chat-stack .chat-bubble:not(:first-child){border-top-left-radius:10px;}
  .chat-bubble.late{transform-origin:0 100%; animation:bubbleIn .7s var(--ease) both;}
  .chat-name{font:700 11.5px 'Plus Jakarta Sans',sans-serif; color:var(--clay); margin-bottom:2px;}
  .chat-text{font:500 14.5px/1.55 'Plus Jakarta Sans',sans-serif; color:var(--ink);}
  .chat-bubble.intro{transform-origin:0 100%; animation:bubbleIn .7s var(--ease) .3s both;}
  .chat-avatar.intro{animation:bubbleIn .6s var(--ease) .2s both;}
  @keyframes bubbleIn{from{opacity:0; transform:translateY(10px) scale(.94);} to{opacity:1; transform:none;}}
  /* Follow-up bubble keeps a fixed height so nothing below it jumps between screens */
  .chat-stack .chat-bubble:not(:first-child){min-height:67px; display:flex; align-items:center;}
  .chat-bubble.ghost{visibility:hidden;}

  /* ---- Tabs: a floating glass island. Docked at the bottom on phones, inline on desktop ---- */
  .tabs{position:fixed; z-index:30; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(380px,calc(100% - 32px));
    display:flex; gap:4px; padding:5px; border-radius:var(--r-pill); background:var(--glass); -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5);
    box-shadow:0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), 0 26px 48px -22px rgba(90,40,60,.45);}
  .tabs button{flex:1; border:none; background:transparent; padding:12px 4px; border-radius:var(--r-pill); font:600 14px 'Plus Jakarta Sans',sans-serif; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .tabs button.active{background:var(--clay); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 12px 20px -12px var(--clay);}

  /* ---- Content ---- */
  /* On phones each tab is a single column. The .col wrappers only matter on desktop, so here
     they dissolve (display:contents) and Riwayat reorders itself: the list first, tools after. */
  .content{padding:0 16px; scroll-margin-top:16px; display:flex; flex-direction:column;}
  .col{display:contents;}
  .tab-history #histList{order:1;}
  .tab-history .summary, .tab-history .actions, .tab-history .confirm-row.block{order:2;}
  .tab-profile .settings-card{order:1;}
  .tab-profile .account-card{order:2;}
  .tab-profile .pw-card{order:3;}
  .side-empty{display:none;}
  .card{border-radius:var(--r-card); padding:22px; margin-bottom:16px;}
  .section-h{margin:0 0 16px; font-weight:800; font-size:19px; line-height:1.25; letter-spacing:-0.025em; color:var(--ink);}
  .eyebrow + .section-h{margin-top:12px;}
  /* Entry choreography: armed only on first load and tab changes, so typing never replays it */
  .reveal:not(.in){opacity:0;}
  .reveal.in{animation:rise .9s var(--ease) backwards; animation-delay:calc(var(--i,0) * 80ms);}
  @keyframes rise{from{opacity:0; transform:translateY(28px) scale(.985);} to{opacity:1; transform:none;}}

  /* ---- Mood: circular icon grid with labels underneath ---- */
  .mood-row{display:grid; grid-template-columns:repeat(5,1fr); gap:4px;}
  .mood{background:none; border:none; cursor:pointer; padding:8px 2px 10px; border-radius:20px; text-align:center;}
  .mood .emoji{display:flex; align-items:center; justify-content:center; width:min(58px,100%); aspect-ratio:1; font-size:28px; border-radius:50%; margin:0 auto 9px; box-shadow:inset 0 1px 1px var(--hi);}
  .mood .lbl{display:block; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .mood.sel .lbl{color:var(--ink);}
  .mood.sel .emoji{animation:pop .5s var(--ease) both; box-shadow:0 0 0 3px var(--card), 0 0 0 5px var(--clay), 0 16px 24px -14px var(--clay);}
  @keyframes pop{0%{transform:scale(1);} 45%{transform:scale(1.2);} 100%{transform:scale(1.06);}}

  /* ---- Mode switch (Check Up / Harian): a segmented control sitting in its own tray ---- */
  .mode-switch{display:flex; gap:4px; padding:5px; margin-bottom:10px; border-radius:var(--r-pill); background:var(--shell); box-shadow:0 0 0 1px var(--ring);}
  .mode-switch button{flex:1; display:flex; align-items:center; justify-content:center; gap:7px; height:44px; border-radius:var(--r-pill); border:none; background:transparent; color:var(--ink-soft); font:600 13.5px 'Plus Jakarta Sans',sans-serif; cursor:pointer;}
  .mode-switch button.active{background:var(--card); color:var(--ink); box-shadow:0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), 0 12px 22px -14px rgba(90,40,60,.45);}
  .mode-switch button.active svg{color:var(--rose);}
  .mode-hint{margin:0 6px 18px; font-size:12px; line-height:1.5; color:var(--ink-soft);}

  /* ---- Writing card ---- */
  .prompt-label{display:inline-flex; padding:5px 12px; margin-bottom:12px; border-radius:var(--r-pill); background:var(--rose-soft); color:var(--rose); font-size:10px; font-weight:700; line-height:1.4; letter-spacing:.2em; text-transform:uppercase;}
  .prompt-text{margin:0; font-weight:800; font-size:22px; line-height:1.3; letter-spacing:-0.03em; text-wrap:pretty;}
  .field-row{display:flex; gap:8px; margin-top:16px; align-items:flex-start;}
  textarea{flex:1; width:100%; min-height:150px; border:none; border-radius:var(--r-input); padding:16px; font:400 15.5px/1.65 'Plus Jakarta Sans',sans-serif; color:var(--ink); resize:vertical; background:var(--well);
    box-shadow:inset 0 0 0 1px var(--line), inset 0 3px 8px -5px rgba(58,34,43,.25); transition:box-shadow .5s var(--ease), background-color .5s var(--ease);}
  textarea::placeholder{color:var(--ink-soft); opacity:.8;}
  textarea:focus{outline:none; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--rose), 0 0 0 5px var(--rose-soft);}
  .mic-btn{flex-shrink:0; width:44px; height:44px; border-radius:50%; border:none; background:var(--well); box-shadow:inset 0 0 0 1px var(--line); color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .mic-btn.on{background:var(--clay); box-shadow:0 12px 20px -12px var(--clay); color:#fff;}
  /* Primary CTA: full pill, with the arrow nested in its own circle flush to the right edge */
  .save{width:100%; height:60px; margin-top:16px; padding:0 9px 0 26px; background:var(--clay); color:#fff; border:none; border-radius:var(--r-pill); font:700 16px 'Plus Jakarta Sans',sans-serif; letter-spacing:-0.01em; cursor:pointer; display:flex; align-items:center; justify-content:space-between;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 20px 32px -18px var(--clay);}
  .save .chev{width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center;}

  .switch{position:relative; width:42px; height:25px; flex-shrink:0;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--paper-dim); box-shadow:inset 0 0 0 1px var(--line); border-radius:25px; cursor:pointer; transition:background-color .4s var(--ease);}
  .slider:before{content:""; position:absolute; width:19px; height:19px; left:3px; top:3px; background:#fff; border-radius:50%; box-shadow:0 2px 6px rgba(58,34,43,.25); transition:transform .4s var(--ease);}
  input:checked + .slider{background:var(--rose);}
  input:checked + .slider:before{transform:translateX(17px);}

  /* ---- Stats: asymmetric bento ---- */
  .bento{display:grid; grid-template-columns:1.15fr 1fr; gap:12px; margin-bottom:16px;}
  .bento.three{grid-template-columns:repeat(3,1fr); gap:10px;}
  .stat{--bezel:5px; border-radius:26px; padding:15px 16px; min-width:0; min-height:96px; display:flex; flex-direction:column; justify-content:flex-end; gap:3px;}
  .stat b{display:block; font-weight:800; font-size:26px; line-height:1.05; letter-spacing:-0.035em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere;}
  .stat span{font-size:11.5px; line-height:1.35; color:var(--ink-soft);}
  .stat.big{grid-row:span 2; padding:18px;}
  .stat.big b{font-size:clamp(64px,19vw,88px); line-height:.9; color:var(--rose);}
  .stat.big .eyebrow{align-self:flex-start; margin-bottom:auto; font-size:10px; line-height:1.4; color:var(--rose);}
  .bento.three .stat{min-height:84px; padding:13px 13px;}
  .bento.three .stat b{font-size:22px;}

  /* Ghost pill: small secondary action with an icon — "Ganti pertanyaan", "Batal mengubah" */
  .btn-ghost-sm{display:inline-flex; align-items:center; gap:6px; margin-top:12px; padding:8px 15px; border-radius:var(--r-pill); border:none; box-shadow:inset 0 0 0 1px var(--line); background:transparent; color:var(--ink); font:600 12.5px 'Plus Jakarta Sans',sans-serif; cursor:pointer;}

  /* Row action: small icon-only button riding on a note's own header — "Ubah", "Favorit", "Hapus" */
  .row-head{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .row-actions{display:flex; gap:2px; flex-shrink:0;}
  .icon-ghost{flex-shrink:0; width:30px; height:30px; border-radius:50%; border:none; background:transparent; color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;}
  .icon-ghost.on{color:var(--gold);}

  /* Chips: date range (Dashboard) and filters (Riwayat) share one pill */
  .range-toggle{display:flex; gap:6px; margin-bottom:16px;}
  .range-toggle button, .chip{display:inline-flex; align-items:center; gap:6px; flex-shrink:0; border:none; background:var(--card); box-shadow:0 0 0 1px var(--ring); border-radius:var(--r-pill); padding:8px 15px; font:600 12.5px 'Plus Jakarta Sans',sans-serif; color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .range-toggle button.active, .chip.active{background:var(--ink); color:var(--paper); box-shadow:0 12px 20px -14px var(--ink);}
  .chart-summary{font-size:13.5px; color:var(--ink-soft); margin-top:14px; line-height:1.55;}
  .chart-draw{animation:reveal .9s var(--ease) both;}
  @keyframes reveal{from{clip-path:inset(0 100% 0 0);} to{clip-path:inset(0 0 0 0);}}
  .insight-box{background:var(--well); box-shadow:inset 0 0 0 1px var(--line); border-radius:var(--r-inner); padding:16px; margin-top:16px; font-size:13.5px; line-height:1.65;}
  .insight-box .lbl{font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--rose); margin-bottom:8px;}

  /* ---- Mood calendar ---- */
  .cal-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:16px;}
  .cal-head .section-h{margin:0; text-transform:capitalize;}
  .cal-nav{display:flex; gap:6px;}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px;}
  .cal-dow{padding-bottom:4px; font-size:10px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; text-align:center; color:var(--ink-soft);}
  .cal-day{aspect-ratio:1; display:flex; align-items:center; justify-content:center; border:none; border-radius:14px; background:transparent; font:600 13px 'Plus Jakarta Sans',sans-serif; font-variant-numeric:tabular-nums; color:var(--ink-soft); opacity:.75;}
  .cal-day.has{opacity:1; color:var(--ink); font-weight:700; cursor:pointer; transition:transform .4s var(--ease), box-shadow .4s var(--ease);}
  .cal-day.today{opacity:1; box-shadow:inset 0 0 0 1.5px var(--rose);}
  .cal-legend{display:flex; flex-wrap:wrap; gap:8px 14px; margin-top:16px; font-size:11.5px; color:var(--ink-soft);}
  .cal-legend i{display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:6px;}

  /* ---- On this day ---- */
  .otd-item{display:flex; align-items:center; gap:12px; width:100%; margin-top:8px; padding:12px 12px 12px 16px; border:none; border-radius:var(--r-inner); background:var(--well); box-shadow:inset 0 0 0 1px var(--line); color:var(--ink); text-align:left; cursor:pointer; transition:transform .4s var(--ease), background-color .4s var(--ease);}
  .otd-body{flex:1; min-width:0;}
  .otd-when{display:flex; align-items:center; flex-wrap:wrap; gap:4px 7px; margin-bottom:3px; font-size:12px; color:var(--ink-soft);}
  .otd-when b{font-weight:700; color:var(--ink);}
  .otd-text{font-size:14px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .otd-go{flex-shrink:0; width:36px; height:36px; border-radius:50%; background:var(--card); box-shadow:0 0 0 1px var(--ring); color:var(--ink-soft); display:flex; align-items:center; justify-content:center; transition:transform .4s var(--ease), color .4s var(--ease);}

  /* ---- History ---- */
  .search{display:flex; align-items:center; gap:10px; height:54px; padding:0 20px; margin-bottom:12px; border-radius:var(--r-pill); background:var(--card); color:var(--ink-soft); box-shadow:0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), var(--shadow-float); transition:box-shadow .5s var(--ease);}
  .search:focus-within{box-shadow:0 0 0 1.5px var(--rose), 0 0 0 6px var(--rose-soft);}
  .search svg{flex-shrink:0;}
  .search input{flex:1; min-width:0; border:none; background:transparent; font:500 15px 'Plus Jakarta Sans',sans-serif; color:var(--ink);}
  .search input::placeholder{color:var(--ink-soft);}
  .search input:focus, .search input:focus-visible{outline:none;}
  .search input::-webkit-search-cancel-button{-webkit-appearance:none;}
  .chips{display:flex; gap:6px; overflow-x:auto; margin:0 -16px 6px; padding:3px 16px 14px; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:16px;}
  .actions button{border:none; background:var(--card); box-shadow:0 0 0 1px var(--ring); border-radius:var(--r-pill); padding:12px; font:600 13px 'Plus Jakarta Sans',sans-serif; color:var(--ink); cursor:pointer;}
  .entry{border-bottom:1px solid var(--line); padding:18px 2px;}
  .entry:last-child{border-bottom:none; padding-bottom:0;}
  .entry-head{display:flex; align-items:center; gap:8px; margin-bottom:8px;}
  .dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
  .entry-date{font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .entry-prompt{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-bottom:5px; padding-top:6px; flex:1; min-width:0;}
  .entry-text{font-size:15px; line-height:1.6; white-space:pre-line; overflow-wrap:anywhere;}
  .entry-text + .entry-prompt{margin-top:14px;}
  .tag{display:inline; border:none; padding:1px 8px; border-radius:var(--r-pill); background:var(--rose-soft); color:var(--rose); font:600 .9em 'Plus Jakarta Sans',sans-serif; cursor:pointer;}
  mark{background:rgba(255,196,64,.5); color:inherit; border-radius:4px; padding:0 2px;}
  .empty{text-align:center; padding:50px 10px; color:var(--ink-soft); line-height:1.6;}
  .empty svg{display:block; margin:0 auto;}
  .card > .empty{padding:28px 10px;}

  /* ---- Toast ---- */
  .toast{position:fixed; bottom:calc(92px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%) translateY(12px) scale(.96); background:var(--ink); color:var(--paper); padding:11px 20px; border-radius:var(--r-pill); font-size:13.5px; font-weight:500; opacity:0; transition:opacity .5s var(--ease), transform .5s var(--ease); pointer-events:none; z-index:40; max-width:90%; text-align:center; box-shadow:0 24px 40px -20px rgba(42,25,32,.6);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0) scale(1);}

  /* ---- Type polish ---- */
  .hero-sub, .chat-text, .chart-summary, .insight-box{text-wrap:pretty;}
  .streak-pill b{font-variant-numeric:tabular-nums;}

  /* ---- Transitions on every interactive element ---- */
  .tabs button, .mood, .mood .emoji, .mood .lbl, .save, .save .chev, .icon-btn, .mic-btn, .actions button, .range-toggle button, .chip, .tag, .mode-switch button, .btn-ghost-sm, .icon-ghost, .stat, .dot, .entry-date, .topbar-brand img{
    transition:transform .45s var(--ease), color .45s var(--ease), background-color .45s var(--ease), box-shadow .45s var(--ease), opacity .45s var(--ease);}
  @keyframes flicker{0%,100%{transform:scale(1) rotate(0);} 30%{transform:scale(1.22) rotate(-7deg);} 60%{transform:scale(1.1) rotate(6deg);}}

  /* ---- Hover: pointer devices only, so touch screens never get a stuck hover ---- */
  @media (hover:hover) and (pointer:fine){
    .tabs button:not(.active):hover{color:var(--ink); background:var(--shell);}
    .mood:not(.sel):hover{background:var(--well);}
    .mood:not(.sel):hover .emoji{transform:translateY(-3px) scale(1.06);}
    .save:hover{transform:translateY(-2px); box-shadow:inset 0 1px 0 rgba(255,255,255,.28), 0 26px 36px -18px var(--clay);}
    .save:hover .chev{transform:translate(3px,-1px) scale(1.05);}
    .icon-btn:not(.on):not(:disabled):hover{color:var(--clay); transform:translateY(-1px);}
    .actions button:hover, .mic-btn:not(.on):hover{color:var(--clay); transform:translateY(-1px); box-shadow:0 0 0 1px var(--clay);}
    .range-toggle button:not(.active):hover, .chip:not(.active):hover{color:var(--clay); box-shadow:0 0 0 1px var(--clay);}
    .mode-switch button:not(.active):hover{color:var(--ink);}
    .btn-ghost-sm:hover{color:var(--clay); box-shadow:inset 0 0 0 1px var(--clay);}
    .icon-ghost:hover{background:var(--well); color:var(--clay);}
    .icon-ghost.on:hover{color:var(--gold);}
    .tag:hover{background:var(--rose); color:#fff;}
    .stat:hover{transform:translateY(-3px);}
    .cal-day.has:hover{transform:scale(1.1); box-shadow:0 0 0 1.5px var(--ink);}
    .otd-item:hover{background:var(--paper-dim);}
    .otd-item:hover .otd-go{transform:translate(3px,-1px) scale(1.05); color:var(--rose);}
    .entry:hover .dot{transform:scale(1.5);}
    .entry:hover .entry-date{color:var(--ink);}
    .topbar-brand img:hover{transform:rotate(-8deg) scale(1.1);}
    .streak-pill:hover .fire{animation:flicker .6s var(--ease);}
    /* pressed state must beat hover, otherwise a click keeps the lifted pose */
    .save:active{transform:translateY(0) scale(.98);}
    .icon-btn:active, .mic-btn:active, .actions button:active, .mode-switch button:active, .btn-ghost-sm:active, .icon-ghost:active, .chip:active, .cal-day.has:active{transform:scale(.96);}
  }
  .tabs button:active, .mood:active, .otd-item:active{transform:scale(.97);}
  .save:active{transform:scale(.98);}

  /* ---- Keyboard focus (accessibility, not optional) ---- */
  button:focus-visible, input:focus-visible{outline:2px solid var(--rose); outline-offset:2px;}
  .tabs button.active:focus-visible, .save:focus-visible, .icon-btn.on:focus-visible{outline-color:var(--ink);}
  .switch input:focus-visible + .slider{outline:2px solid var(--rose); outline-offset:2px;}

  /* ---- Skeleton loading state ---- */
  .skeleton span{display:block; position:relative; overflow:hidden; height:10px; border-radius:6px; margin-bottom:8px; background:var(--line);}
  .skeleton span.short{width:60%; margin-bottom:0;}
  .skeleton span::after{content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, var(--hover), transparent); animation:sweep 1.4s var(--ease) infinite;}
  @keyframes sweep{to{transform:translateX(100%);}}

  /* ---- Notes written today ---- */
  .note{padding:14px 0; border-bottom:1px solid var(--line);}
  .note:first-of-type{padding-top:0;}
  .note:last-child{border-bottom:none; padding-bottom:0;}
  .note-q{margin-bottom:4px; padding-top:6px; font-size:12.5px; font-style:italic; color:var(--ink-soft);}
  .note-t{font-size:14.5px; line-height:1.55; white-space:pre-line; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;}
  /* One day can hold several notes — a lighter dashed rule marks the boundary between them,
     kept visually distinct from the solid rule .entry already uses to mark day boundaries. */
  .note-block.divider{margin-top:14px; padding-top:14px; border-top:1px dashed var(--line);}
  .confirm-row{display:flex; align-items:center; flex-wrap:wrap; gap:8px; margin-top:10px; font-size:12.5px; color:var(--ink-soft);}
  .confirm-row .btn-ghost-sm{margin-top:0;}
  .confirm-row.block{margin:0 4px 16px;}
  .btn-ghost-sm.danger{box-shadow:inset 0 0 0 1px var(--rose); color:var(--rose);}
  @media (hover:hover) and (pointer:fine){ .btn-ghost-sm.danger:hover{background:var(--rose); color:#fff;} }

  /* ---- AI summary card ---- */
  .summary .range-toggle{margin-bottom:14px;}
  .summary .skeleton{margin-bottom:14px;}
  .summary-hint{margin:0 0 16px; font-size:13.5px; line-height:1.55; color:var(--ink-soft);}
  .summary-text{margin:0 0 6px; font-size:14.5px; line-height:1.7; white-space:pre-line;}
  .summary-meta{margin:0 0 16px; font-size:12px; color:var(--ink-soft);}
  .summary-err{margin:0 0 12px; font-size:13px; color:var(--rose);}
  .summary-privacy{margin:12px 0 0; font-size:11.5px; line-height:1.5; color:var(--ink-soft);}
  .progress{height:8px; border-radius:var(--r-pill); background:var(--well); box-shadow:inset 0 0 0 1px var(--line); overflow:hidden;}
  .progress span{display:block; height:100%; border-radius:var(--r-pill); background:var(--clay);}
  .btn-soft{width:100%; height:52px; border-radius:var(--r-pill); border:none; background:var(--rose-soft); color:var(--clay); font:700 14.5px 'Plus Jakarta Sans',sans-serif; cursor:pointer; transition:transform .45s var(--ease), background-color .45s var(--ease), color .45s var(--ease);}
  .btn-soft:disabled{opacity:.55; cursor:default;}
  .btn-soft:active:not(:disabled){transform:scale(.98);}
  @media (hover:hover) and (pointer:fine){ .btn-soft:not(:disabled):hover{background:var(--clay); color:#fff;} }

  /* ---- Text inputs: sign-in fields and the circle forms ---- */
  .field{display:block; margin-top:14px;}
  .field span{display:block; margin:0 0 6px 6px; font-size:12px; font-weight:600; color:var(--ink-soft);}
  .field input, .inline-form input{width:100%; min-width:0; border:none; background:var(--well); box-shadow:inset 0 0 0 1px var(--line); font:500 15px 'Plus Jakarta Sans',sans-serif; color:var(--ink); transition:box-shadow .5s var(--ease), background-color .5s var(--ease);}
  .field input{height:54px; padding:0 18px; border-radius:18px;}
  .field input::placeholder, .inline-form input::placeholder{color:var(--ink-soft); opacity:.8;}
  .field input:focus, .inline-form input:focus{outline:none; background:var(--card); box-shadow:inset 0 0 0 1.5px var(--rose), 0 0 0 5px var(--rose-soft);}
  .inline-form{display:flex; gap:8px; margin-top:12px;}
  .inline-form input{flex:1; height:46px; padding:0 18px; border-radius:var(--r-pill); font-size:14px;}
  .inline-form .chip{height:46px; padding:0 18px;}
  .auth .save{margin-top:22px;}
  .auth .summary-err{margin:14px 0 0;}

  /* ---- Circles: streak together ---- */
  .circle-strip:not(:empty){margin-bottom:16px;}
  .circle-strip .otd-item{background:var(--card); box-shadow:0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), var(--shadow-float);}
  .circle-strip .otd-item:first-child{margin-top:0;}
  .circle-fire{flex-shrink:0; display:inline-flex; align-items:baseline; gap:5px; padding:8px 13px; border-radius:var(--r-pill); background:var(--well); box-shadow:inset 0 0 0 1px var(--line); color:var(--ink-soft); font-variant-numeric:tabular-nums;}
  .circle-fire b{font-weight:800; font-size:16px; letter-spacing:-0.02em;}
  .circle-fire .fire{font-size:14px; opacity:.45;}
  .circle-fire .unit{font-size:11.5px; font-weight:600;}
  .circle-fire.lit{background:var(--rose-soft); box-shadow:none; color:var(--rose);}
  .circle-fire.lit .fire{opacity:1;}
  .circle-fire.big{padding:10px 16px;}
  .circle-fire.big b{font-size:26px; line-height:1; letter-spacing:-0.035em;}
  .circle{margin-top:14px; padding:16px; border-radius:var(--r-inner); background:var(--well); box-shadow:inset 0 0 0 1px var(--line);}
  .circle-head{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .circle-title{min-width:0;}
  .circle-name{font-weight:800; font-size:16.5px; letter-spacing:-0.02em; overflow-wrap:anywhere;}
  .circle-meta{margin-top:3px; font-size:12.5px; line-height:1.45; color:var(--ink-soft); text-wrap:pretty;}
  .members{display:flex; flex-wrap:wrap; gap:6px; margin-top:14px;}
  .member{display:inline-flex; align-items:center; gap:7px; max-width:100%; padding:4px 12px 4px 4px; border-radius:var(--r-pill); background:var(--card); box-shadow:0 0 0 1px var(--ring); font-size:12.5px; font-weight:600; color:var(--ink-soft);}
  .member i{flex-shrink:0; width:24px; height:24px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:var(--paper-dim); font-style:normal; font-size:11px; font-weight:800;}
  .member.done{color:var(--ink);}
  .member.done i{background:var(--rose); color:#fff;}
  .circle-foot{display:flex; flex-wrap:wrap; gap:0 8px; margin-top:2px;}
  .circle-foot b{letter-spacing:.12em;}
  .circle .confirm-row{margin-top:14px;}
  #circleCard .summary-err{margin:12px 0 0;}

  /* ---- Profil: who you are, how the app behaves, and the way out ---- */
  .profile-head{display:flex; align-items:center; gap:14px; margin-bottom:18px;}
  .avatar{flex-shrink:0; width:64px; height:64px; border-radius:50%; display:flex; align-items:center; justify-content:center; background:linear-gradient(140deg, var(--rose), #F0A07E); color:#fff; font:800 26px 'Plus Jakarta Sans',sans-serif; box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 18px 30px -18px var(--clay);}
  .profile-id{min-width:0;}
  .profile-id .section-h{margin:0; overflow-wrap:anywhere;}
  .profile-meta{margin:3px 0 0; font-size:13px; line-height:1.45; color:var(--ink-soft);}
  .profile-card .bento{margin-bottom:4px;}
  .field-hint{margin:8px 6px 14px; font-size:12px; line-height:1.5; color:var(--ink-soft);}
  .setting{display:flex; align-items:center; justify-content:space-between; gap:14px; padding:14px 0; border-top:1px solid var(--line);}
  .setting:first-of-type{border-top:none; padding-top:2px;}
  .setting:last-of-type{padding-bottom:0;}
  .setting-title{font-weight:700; font-size:14.5px;}
  .setting-hint{margin-top:3px; max-width:30ch; font-size:12px; line-height:1.45; color:var(--ink-soft); text-wrap:pretty;}
  .setting .range-toggle{flex-shrink:0; margin:0;}
  .setting .btn-ghost-sm{flex-shrink:0; margin-top:0;}
  .setting input[type=time]{flex-shrink:0; border:none; box-shadow:inset 0 0 0 1px var(--line); border-radius:12px; padding:8px 10px; font:500 14px 'Plus Jakarta Sans',sans-serif; background:var(--well); color:var(--ink);}
  .btn-soft.danger{background:transparent; box-shadow:inset 0 0 0 1px var(--rose);}

  /* ---- The composer: the journal card everything else is arranged around. It gets a wider,
     rose-tinted tray, a soft glow, larger type and a taller writing area than any other card. ---- */
  .composer{--bezel:8px; border-radius:38px; padding:18px 16px 16px;
    background:linear-gradient(var(--card),var(--card)) padding-box, linear-gradient(140deg, rgba(214,69,110,.44), rgba(255,170,130,.36) 45%, rgba(214,69,110,.16)) border-box;
    box-shadow:0 0 0 1px var(--ring), inset 0 0 0 1px var(--ring), inset 0 1px 1px var(--hi), 0 56px 90px -56px rgba(214,69,110,.62), 0 18px 36px -26px rgba(120,60,80,.24);}
  .composer .mode-switch{margin-bottom:8px;}
  .composer .mode-hint{margin:0 8px 20px;}
  .composer .prompt-label{margin-bottom:10px;}
  .composer .prompt-text{font-size:clamp(25px,6.8vw,30px); line-height:1.18;}
  .composer textarea{min-height:200px; padding:18px; font-size:16.5px;}
  .composer .save{height:64px; margin-top:20px; font-size:17px;}
  .composer-body{padding:0 6px 4px;}
  /* Harian's four steps, as a progress strip above the question */
  .steps{display:flex; gap:5px; margin:0 0 16px;}
  .steps i{flex:1; height:4px; border-radius:var(--r-pill); background:var(--paper-dim);}
  .steps i.done{background:var(--rose);}
  .steps i.now{background:var(--rose); opacity:.45;}
  .field-label{margin:22px 2px 8px; font-size:12px; font-weight:700; color:var(--ink-soft);}
  .composer .mood{padding:6px 2px 6px;}
  .composer .mood .emoji{width:min(48px,100%); font-size:24px; margin-bottom:6px;}
  .composer .mood .lbl{font-size:11.5px;}
  /* Signed in, the page opens on the composer: the headline belongs to the sign-in screen. */
  .hero.compact .hero-copy{display:none;}
  .hero.compact .chat{margin:14px 0 14px;}
  .hero.compact .chat-bubble{border-radius:22px 22px 22px 8px;}
  .brand-word{font:800 15px 'Plus Jakarta Sans',sans-serif; letter-spacing:-0.02em; color:var(--ink);}
  .brand-word + .date{font-weight:600; color:var(--ink-soft);}
  @media (max-width:479px){ .brand-word{display:none;} .brand-word + .date{font-weight:700; color:var(--ink);} }

  /* ---- Pictures on a note ---- */
  .photo-bar{display:flex; flex-wrap:wrap; gap:0 8px;}
  .photos{display:flex; flex-wrap:wrap; gap:8px; margin-top:12px;}
  .photos:empty{display:none;}
  .photo{position:relative; display:block; flex-shrink:0; width:76px; height:76px; padding:0; border:none; border-radius:18px; overflow:hidden; background:var(--well); box-shadow:0 0 0 1px var(--ring); cursor:zoom-in; transition:transform .45s var(--ease), box-shadow .45s var(--ease);}
  .photo img{display:block; width:100%; height:100%; object-fit:cover;}
  .photo.draft, .photo.busy{cursor:default;}
  .photo-x{position:absolute; top:4px; right:4px; width:24px; height:24px; padding:0; border:none; border-radius:50%; background:rgba(42,25,32,.72); color:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .photo.busy::after{content:""; position:absolute; inset:0; transform:translateX(-100%); background:linear-gradient(90deg, transparent, var(--hover), transparent); animation:sweep 1.4s var(--ease) infinite;}
  @media (hover:hover) and (pointer:fine){ .photo:not(.draft):not(.busy):hover{transform:scale(1.05); box-shadow:0 0 0 1px var(--ring), var(--shadow-float);} }
  /* Full-size view: a fixed overlay, so the blur behind it never repaints with the page. */
  .lightbox{position:fixed; inset:0; z-index:45; display:flex; align-items:center; justify-content:center; padding:24px; background:rgba(24,12,17,.86); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px); cursor:zoom-out; animation:settle .5s var(--ease) both;}
  .lightbox img{max-width:100%; max-height:100%; border-radius:20px; box-shadow:0 40px 80px -30px rgba(0,0,0,.8); animation:rise .6s var(--ease) both;}
  .lightbox .icon-btn{position:absolute; top:20px; right:20px; background:rgba(255,255,255,.16); color:#fff;}

  /* ---- Camera: live preview in the same fixed overlay as the full-size picture view ---- */
  .camera{flex-direction:column; gap:20px; cursor:default; padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px));}
  .camera video{min-height:0; max-width:100%; max-height:calc(100% - 116px); border-radius:24px; background:#000; box-shadow:0 40px 80px -30px rgba(0,0,0,.8);}
  .camera video.mirror{transform:scaleX(-1);}   /* a front camera should behave like a mirror while you frame the shot */
  .cam-note{margin:0; font-size:14px; color:#fff;}
  .cam-bar{display:flex; align-items:center; justify-content:center; gap:28px; min-height:80px;}
  .camera .icon-btn{position:static; width:44px; height:44px;}
  .cam-shutter{width:68px; height:68px; padding:0; border:none; border-radius:50%; background:#fff; box-shadow:0 0 0 4px rgba(24,12,17,.9), 0 0 0 7px #fff; cursor:pointer; transition:transform .45s var(--ease), opacity .45s var(--ease);}
  .cam-shutter:active{transform:scale(.92);}
  .cam-shutter:disabled{opacity:.4; cursor:default;}
  .cam-shutter:focus-visible{outline-color:#fff; outline-offset:10px;}

  /* ---- First-visit tour: one dimmed layer with a hole over the thing being explained ---- */
  .tour{position:fixed; inset:0; z-index:60; touch-action:none;}   /* a swipe on the dimmed page must not scroll it */
  /* While touring, the page gets room below it so even the last card can be brought to the top. */
  .touring .app{padding-bottom:85vh;}
  .tour-hole{position:fixed; border-radius:24px; box-shadow:0 0 0 200vmax rgba(24,12,17,.68); pointer-events:none;}
  .tour-card{position:fixed; width:min(360px,calc(100vw - 32px)); padding:20px; border:var(--bezel) solid transparent; border-radius:var(--r-card);
    background:linear-gradient(var(--card),var(--card)) padding-box, rgba(255,255,255,.22) border-box; box-shadow:0 40px 80px -30px rgba(0,0,0,.7);}
  .tour-card.in{animation:rise .6s var(--ease) both;}
  .tour-card .section-h{margin-bottom:8px;}
  .tour-text{margin:0; font-size:14.5px; line-height:1.6; color:var(--ink); text-wrap:pretty;}
  .tour-actions{display:flex; align-items:center; gap:8px; margin-top:18px;}
  .tour-actions .btn-ghost-sm{margin-top:0;}
  .tour-next{margin-left:auto; padding:10px 20px; border:none; border-radius:var(--r-pill); background:var(--clay); color:#fff; font:700 14px 'Plus Jakarta Sans',sans-serif; cursor:pointer; box-shadow:0 14px 22px -14px var(--clay); transition:transform .45s var(--ease);}
  .tour-next:active{transform:scale(.96);}
  .tour-next:focus-visible{outline-color:var(--ink);}

  /* ---- Desktop: a compact masthead (headline left, greeting right), then each tab as two
     unequal columns using the full width. The top bar is a floating glass island that stays
     put while the page scrolls; the tab pill is fixed separately but sits nested inside it. ---- */
  @media (min-width:1024px){
    .app{max-width:1280px; padding:106px 40px 140px;}
    .hero{padding:0;}
    .topbar{position:fixed; z-index:20; top:28px; left:50%; transform:translateX(-50%); width:min(1200px,calc(100% - 80px)); background:var(--glass); -webkit-backdrop-filter:blur(22px) saturate(1.5); backdrop-filter:blur(22px) saturate(1.5);}
    .hero-grid{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:clamp(40px,6vw,96px); align-items:end; padding:clamp(28px,5vh,56px) 8px clamp(36px,6vh,64px);}
    .hero-copy{margin:0;}
    .hero-h{font-size:clamp(44px,4.4vw,68px); margin:20px 0 0;}
    .hero-sub{font-size:16px; margin:18px 0 0;}
    .chat{margin:0;}
    .tabs{top:32px; bottom:auto; width:auto; padding:4px; background:var(--well); -webkit-backdrop-filter:none; backdrop-filter:none; box-shadow:inset 0 0 0 1px var(--line);}
    .tabs button{flex:none; padding:8px 24px;}
    .content{display:grid; grid-template-columns:minmax(0,7fr) minmax(0,5fr); gap:0 28px; align-items:start; padding:0; scroll-margin-top:104px;}
    .content > :not(.col){grid-column:1 / -1;}
    .col{display:block; min-width:0;}
    .tab-history{grid-template-columns:minmax(0,5fr) minmax(0,7fr);}
    .tab-auth{grid-template-columns:minmax(0,500px); justify-content:center;}
    .side-empty{display:block;}
    .chips{margin:0 0 6px; padding:3px 2px 14px; flex-wrap:wrap; overflow:visible;}
    .card{padding:28px;}
    .composer{padding:30px 30px 28px;}
    .composer .prompt-text{font-size:34px;}
    .composer textarea{min-height:240px;}
    .hero.compact .hero-grid{display:block; padding:14px 8px 20px;}
    .hero.compact .chat{max-width:560px;}
    .toast{bottom:32px;}
  }
  /* Riwayat's tools stay beside the list while it scrolls, when the window is tall enough to hold them. */
  @media (min-width:1024px) and (min-height:780px){
    .tab-history .col-side{position:sticky; top:100px;}
  }

  /* ---- Print report ---- */
  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block; position:absolute; top:0; left:0; width:100%; padding:20px;}
  }

  /* ---- One global switch for people who ask for less motion ---- */
  @media (prefers-reduced-motion: reduce){
    html{scroll-behavior:auto;}
    *, *::before, *::after{animation-duration:.01ms !important; animation-delay:0s !important; animation-iteration-count:1 !important; transition-duration:.01ms !important;}
  }
</style>
</head>

// ---------- Storage backend: real Express + SQLite API ----------
// Every server call goes through here: a 401 in the middle of a session (expired, or signed out
// in another tab) drops back to the sign-in screen instead of failing one request at a time.
// It also tells the server which calendar day it is here, so "today" never depends on the server's clock.
function api(url, opts={}){
  const headers = {...(opts.headers||{}), 'X-Local-Date':todayStr()};
  return window.fetch(url, {...opts, headers}).then(res=>{ if(res.status===401 && me) signedOut(); return res; });
}
async function initStorage(){
  try{
    const meRes = await api('/api/me');
    if(meRes.status===401){
      me = null;
      authCfg = await api('/api/auth/config').then(r=>r.json());
      if(authCfg.firstAccount) authMode = 'register';
      entriesReady = true; render();
      return;
    }
    me = await meRes.json();
    const [entriesRes, settingsRes, circlesRes] = await Promise.all([
      api('/api/entries').then(r=>r.json()),
      api('/api/settings').then(r=>r.json()),
      api('/api/circles').then(r=>r.json())
    ]);
    entries = entriesRes;
    circles = Array.isArray(circlesRes) ? circlesRes : [];
    reminder = {enabled: !!settingsRes.reminderEnabled, time: settingsRes.reminderTime || '20:00'};
    insightWeekCached = settingsRes.insightWeek || null;
    dashboardInsight = settingsRes.insightWeek===weekKey() ? (settingsRes.insightText||null) : null;
    summaryText = settingsRes.summaryText || null; summaryAt = settingsRes.summaryAt || null;
    if(settingsRes.summaryRange) summaryRange = settingsRes.summaryRange;
    dayMode = settingsRes.dayMode==='checkup' ? 'checkup' : 'daily';
    if(settingsRes.ai) ai = settingsRes.ai;
    tourDone = !!settingsRes.tourDone;
    restoreDraft();
    entriesReady = true; syncPromptOnce();
  }catch(e){
    entriesReady = true;
    showToast('Azzifa belum bisa terhubung ke server. Coba muat ulang sebentar lagi, ya.');
  }
  render();
  if(me && !tourDone) setTimeout(startTour, 1500);   // after the greeting has had its moment
}
function persistProfile(patch){

}

// Journal days are the writer's own calendar dates, never UTC: something written at 06:00 in
// Jakarta belongs to that morning, not to the day before.
function localDay(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function todayStr(){ return localDay(new Date()); }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return localDay(d); }
// A 'YYYY-MM-DD' string read as a local date (new Date('YYYY-MM-DD') would mean UTC midnight).
function asDate(d){ return typeof d==='string' && /^\d{4}-\d{2}-\d{2}$/.test(d) ? new Date(d+'T00:00:00') : new Date(d); }

// The unsaved draft survives a refresh or an accidental tab close. It is kept in this browser
// only, per account and per day, and cleared once the note is saved or the account signs out.
const draftKey = () => 'azzifa_draft_' + (me ? me.username : '');
function saveDraft(){
  if(!me || editingIdx!==null) return;   // editing an existing note is not a draft worth restoring
  try{
    if(draftText || draftPhotos.length) localStorage.setItem(draftKey(), JSON.stringify({day:todayStr(), text:draftText||'', photos:draftPhotos}));
    else localStorage.removeItem(draftKey());
  }catch(e){}
}
function rememberDraft(text){ draftText = text; saveDraft(); }
function restoreDraft(){
  try{
    const saved = JSON.parse(localStorage.getItem(draftKey()) || 'null');
    if(!saved || saved.day!==todayStr() || draftText!==null) return;
    if(saved.text) draftText = saved.text;
    if(Array.isArray(saved.photos)) draftPhotos = saved.photos.filter(isPhotoId).slice(0, MAX_PHOTOS);
  }catch(e){}
}
function forgetDraft(){ try{ localStorage.removeItem(draftKey()); }catch(e){} }
function setDayMode(m){ if(dayMode===m) return; dayMode=m; persistProfile({dayMode:m}); render(); }
async function persistEntry(entry){
  const res = await api(`/api/entries/${entry.date}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entry)});
  if(!res.ok) throw new Error('bad status');
}
async function deleteEntryDoc(date){
  const res = await api(`/api/entries/${date}`, {method:'DELETE'});
  if(!res.ok) throw new Error('bad status');
}
function askDeleteNote(date, idx){ confirmDeleteKey = date+'::'+idx; render(); }
function cancelDeleteNote(){ confirmDeleteKey = null; render(); }
// An in-page two-step confirm rather than window.confirm(): tap trash, and a "Ya, hapus / Batal"
// row replaces it. It stays in the app's own voice and works where native dialogs are blocked.
async function deleteNote(date, idx){
  confirmDeleteKey = null;
  const existing = entries.find(e=>e.date===date);
  if(!existing) return;
  const notes = notesOf(existing).filter((_,i)=>i!==idx);
  try{
    if(notes.length===0){
      await deleteEntryDoc(date);
      entries = entries.filter(e=>e.date!==date);
    } else {
      const entry = {...existing, notes, prompt:notes[0].prompt, text:notes.map(n=>n.text).join('\n\n'), updatedAt:Date.now()};
      await persistEntry(entry);
      entries = [...entries.filter(e=>e.date!==date), entry];
    }
  }catch(e){ showToast('Belum berhasil dihapus. Coba lagi sebentar lagi, ya.'); return; }
  if(editingIdx!==null && date===todayStr()) cancelEdit();
  showToast('Catatannya sudah dihapus.'); render();
  if(circles.length) loadCircles();
}
function getGreeting(){

function fmtDate(d){ return asDate(d).toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'}); }
function fmtShort(d){ return asDate(d).toLocaleDateString('id-ID',{day:'numeric',month:'short'}); }
function moodInfo(k){ return MOODS.find(m=>m.k===k) || MOODS[2]; }
function hasEntryToday(){ return !!entries.find(e=>e.date===todayStr()); }
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
// A day can hold several notes. Older entries (one prompt + one text) are read as a single note.
function notesOf(e){ return Array.isArray(e.notes) && e.notes.length ? e.notes : [{prompt:e.prompt||'', text:e.text||'', at:e.updatedAt||0}]; }
function textOf(e){ return notesOf(e).map(n=>n.text).join('\n\n'); }
function todayNotes(){ const e=entries.find(x=>x.date===todayStr()); return e?notesOf(e):[]; }
function totalNotes(){ return entries.reduce((n,e)=>n+notesOf(e).length,0); }
function pickPrompt(notes){
  const used=new Set((notes||todayNotes()).map(n=>n.prompt));
  const all=PROMPTS.map((_,i)=>i).filter(i=>i!==promptIdx);
  const fresh=all.filter(i=>!used.has(PROMPTS[i]));
  const pool=fresh.length?fresh:all;
  return pool[Math.floor(Math.random()*pool.length)];
}
function syncPromptOnce(){ if(promptSynced) return; promptSynced=true; promptIdx=pickPrompt(); }

function rollingCheckins(n=7){
  const days=new Set(entries.map(e=>e.date));
  let count=0;
  for(let i=0;i<n;i++){ if(days.has(daysAgo(i))) count++; }
  return count;
}
function longestStreakEver(){
  const sortedDays=[...new Set(entries.map(e=>e.date))].sort();
  let longest=0,current=0,prev=null;
  sortedDays.forEach(d=>{
    current = prev && (new Date(d)-new Date(prev))/86400000===1 ? current+1 : 1;
    longest=Math.max(longest,current); prev=d;
  });
  return longest;
}
function entriesThisMonth(){ const ym=todayStr().slice(0,7); return entries.filter(e=>e.date.startsWith(ym)).reduce((n,e)=>n+notesOf(e).length,0); }
function hardestDayInfo(){
  const buckets={}; const dayNames=['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
  entries.forEach(e=>{
    const d=asDate(e.date).getDay(); const v=MOOD_ORDER.indexOf(e.mood)+1;
    if(!buckets[d]) buckets[d]={sum:0,count:0};
    buckets[d].sum+=v; buckets[d].count++;
  });
  let worst=null;
  Object.entries(buckets).forEach(([d,b])=>{ const avg=b.sum/b.count; if(!worst||avg<worst.avg) worst={day:dayNames[d],avg}; });
  return worst;
}

// ---------- Voice input (shared) ----------
let recognizer=null, micTarget=null, micActive=false, micIntentionalStop=false;
function getRecognizer(){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR) return null;
  if(!recognizer){
    recognizer=new SR(); recognizer.lang='id-ID'; recognizer.continuous=true; recognizer.interimResults=true;
    recognizer.onresult=(ev)=>{
      let finalText='';
      for(let i=ev.resultIndex;i<ev.results.length;i++){ if(ev.results[i].isFinal) finalText+=ev.results[i][0].transcript; }
      if(finalText && micTarget){
        const el=document.getElementById(micTarget);
        if(el){ el.value += (el.value?' ':'')+finalText.trim(); if(micTarget==='entryText') rememberDraft(el.value); }
      }
    };
    recognizer.onerror=(ev)=>{
      if(ev.error==='not-allowed' || ev.error==='service-not-allowed'){
        micIntentionalStop=true; showToast('Mikrofonnya belum diizinkan. Kamu bisa mengaktifkannya lewat pengaturan browser.');
      } else if(ev.error!=='no-speech'){
        micIntentionalStop=true; showToast('Suaranya sempat terputus. Coba sekali lagi, ya.');
      }
      // 'no-speech' is harmless — onend will decide whether to keep listening
    };
    recognizer.onend=()=>{
      if(micActive && !micIntentionalStop){
        try{ recognizer.start(); return; }catch(e){}
      }
      micActive=false; micTarget=null; renderMicButtons();
    };
  }
  return recognizer;
}
function renderMicButtons(){
  document.querySelectorAll('.mic-btn').forEach(b=>{
    b.classList.toggle('on', micActive && b.dataset.target===micTarget);
  });
}
function toggleMic(targetId){
  const r=getRecognizer();
  if(!r){ showToast('Browser ini belum mendukung input suara. Kamu tetap bisa mengetik seperti biasa.'); return; }
  const el=document.getElementById(targetId);
  if(micActive && micTarget===targetId){
    micIntentionalStop=true; micActive=false; micTarget=null; r.stop();
  } else {
    if(micActive){ micIntentionalStop=true; r.stop(); }
    micIntentionalStop=false; micTarget=targetId; micActive=true;
    if(targetId==='entryText') draftText = el?el.value:draftText;
    try{ r.start(); }catch(e){}
  }
  renderMicButtons();
}

function checkReminderTick(){
  if(!me || !reminder.enabled || hasEntryToday()) return;
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  const now=new Date(); const hm=`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  // Once a day, at or after the chosen time — a throttled background tab can skip the exact

  if(hm>=reminder.time && notifiedDay!==todayStr() && document.hidden){
    notifiedDay=todayStr();
    try{ new Notification('Azzifa',{body:'Waktunya mampir sebentar. Tidak perlu panjang, yang penting kamu cerita.'}); }catch(e){}

// ---------- Pictures on a note ----------
const MAX_PHOTOS = 4;          // per note; the server enforces the same cap
const PHOTO_MAX_SIDE = 1600;   // longest side after shrinking, in pixels
const isPhotoId = id => typeof id==='string' && /^[a-f0-9]{32}$/.test(id);
// Phone cameras produce 5-10 MB files. Each picture is redrawn smaller and re-encoded as JPEG in
// the browser before upload, which also drops the location and device details cameras embed.
async function shrinkPhoto(file){
  const bitmap = await createImageBitmap(file);
  const scale = Math.min(1, PHOTO_MAX_SIDE/Math.max(bitmap.width, bitmap.height));
  const canvas = document.createElement('canvas');
  canvas.width = Math.max(1, Math.round(bitmap.width*scale)); canvas.height = Math.max(1, Math.round(bitmap.height*scale));
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, canvas.width, canvas.height);   // JPEG has no transparency
  ctx.drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  if(bitmap.close) bitmap.close();
  return new Promise((resolve, reject)=>canvas.toBlob(b=>b ? resolve(b) : reject(new Error('encode failed')), 'image/jpeg', .85));
}
// "Kamera" opens a live preview in the page wherever the browser allows one. Browsers only
// allow it on HTTPS or localhost; elsewhere the camera input is the fallback, which on a phone
// still hands over to its camera app.
function pickPhoto(source){
  if(source==='gallery'){ document.getElementById('photoGallery')?.click(); return; }
  if(draftPhotos.length+photoBusy>=MAX_PHOTOS){ showToast(`Satu catatan muat ${MAX_PHOTOS} foto. Simpan dulu, lalu lanjut di catatan berikutnya, ya.`); return; }
  if(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) openCamera();
  else document.getElementById('photoCamera')?.click();
}

// ---------- Camera ----------
let camStream = null, camDevices = [], camIndex = 0;
async function openCamera(){
  closeCamera();
  const box = document.createElement('div');
  box.className = 'lightbox camera'; box.id = 'camera';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Kamera');
  box.innerHTML = `<video autoplay playsinline muted></video>
    <p class="cam-note" role="status">Menyalakan kamera…</p>
    <div class="cam-bar">
      <button class="icon-btn" id="camFlip" hidden onclick="flipCamera()" title="Ganti kamera" aria-label="Ganti kamera">${ICONS.refresh}</button>
      <button class="cam-shutter" onclick="snapPhoto()" title="Ambil foto" aria-label="Ambil foto" disabled></button>
      <button class="icon-btn" onclick="closeCamera()" title="Tutup kamera" aria-label="Tutup kamera">${ICONS.close}</button>
    </div>`;
  document.body.appendChild(box);
  await startCamera();
}
// First open prefers the back camera; "Ganti kamera" then walks through every camera the device has.
async function startCamera(deviceId){
  stopCameraStream();
  const video = deviceId ? {deviceId:{exact:deviceId}} : {facingMode:{ideal:'environment'}};
  try{
    camStream = await navigator.mediaDevices.getUserMedia({video:{...video, width:{ideal:1920}, height:{ideal:1440}}, audio:false});
  }catch(e){
    closeCamera();
    showToast(e.name==='NotAllowedError' ? 'Kameranya belum diizinkan. Kamu bisa mengizinkannya lewat ikon di bilah alamat browser.'
      : e.name==='NotFoundError' ? 'Kameranya belum ketemu di perangkat ini. Kamu tetap bisa pilih foto dari Galeri.'
      : 'Kameranya belum bisa dinyalakan. Mungkin sedang dipakai aplikasi lain. Coba lagi sebentar lagi, ya.');
    return;
  }
  const box = document.getElementById('camera');
  if(!box){ stopCameraStream(); return; }   // closed while the permission prompt was still open
  const el = box.querySelector('video'), track = camStream.getVideoTracks()[0];
  el.srcObject = camStream;
  el.classList.toggle('mirror', track.getSettings().facingMode!=='environment');
  el.onloadedmetadata = ()=>{
    box.querySelector('.cam-note').hidden = true;
    const shutter = box.querySelector('.cam-shutter'); shutter.disabled = false; shutter.focus();
  };
  // Device names and ids are only listed once permission has been given, so this comes last.
  camDevices = (await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');
  camIndex = Math.max(0, camDevices.findIndex(d=>d.deviceId===track.getSettings().deviceId));
  const flip = document.getElementById('camFlip'); if(flip) flip.hidden = camDevices.length<2;
}
function flipCamera(){
  if(camDevices.length<2) return;
  camIndex = (camIndex+1) % camDevices.length;
  startCamera(camDevices[camIndex].deviceId);
}
// The frame goes through the same shrink-and-upload path as a picture chosen from the gallery.
function snapPhoto(){
  const el = document.querySelector('#camera video');
  if(!el || !el.videoWidth) return;
  const canvas = document.createElement('canvas');
  canvas.width = el.videoWidth; canvas.height = el.videoHeight;
  canvas.getContext('2d').drawImage(el, 0, 0);
  canvas.toBlob(blob=>{ closeCamera(); if(blob) addPhotoFiles([new File([blob], 'kamera.jpg', {type:'image/jpeg'})]); }, 'image/jpeg', .92);
}
function stopCameraStream(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream = null; } }
function closeCamera(){ stopCameraStream(); document.getElementById('camera')?.remove(); }
function addPhotos(input){ const files=[...input.files]; input.value=''; addPhotoFiles(files); }
async function addPhotoFiles(files){
  const room = Math.max(0, MAX_PHOTOS - draftPhotos.length - photoBusy);
  if(files.length>room) showToast(`Satu catatan muat ${MAX_PHOTOS} foto. ${room ? 'Sisanya belum ikut, ya.' : 'Simpan dulu, lalu lanjut di catatan berikutnya, ya.'}`);
  for(const file of files.slice(0, room)){
    photoBusy++; paintPhotoStrip();
    try{
      const blob = await shrinkPhoto(file);
      const res = await api('/api/photos', {method:'POST', headers:{'Content-Type':'image/jpeg'}, body:blob});
      const data = await res.json();
      if(res.ok){ draftPhotos = [...draftPhotos, data.id]; saveDraft(); }
      else showToast(data.error || 'Fotonya belum berhasil diunggah. Coba lagi sebentar lagi, ya.');
    }catch(e){ showToast('Fotonya belum bisa dibaca. Coba foto lain, ya.'); }
    photoBusy--; paintPhotoStrip();
  }
}
function dropDraftPhoto(id){ draftPhotos = draftPhotos.filter(p=>p!==id); saveDraft(); paintPhotoStrip(); }
// Repaints only the strip, so adding a picture never rebuilds the textarea being typed in.
function paintPhotoStrip(){ const el=document.getElementById('photoStrip'); if(el) el.innerHTML=renderDraftPhotos(); }
function renderDraftPhotos(){
  return draftPhotos.map(id=>`<span class="photo draft"><img src="/api/photos/${id}" alt="Foto untuk catatan ini" onerror="dropDraftPhoto('${id}')"><button class="photo-x" onclick="dropDraftPhoto('${id}')" title="Lepas foto" aria-label="Lepas foto">${ICONS.close}</button></span>`).join('')
    + '<span class="photo busy" role="status" aria-label="Mengunggah foto"></span>'.repeat(photoBusy);
}
function renderPhotos(ids){
  const list = Array.isArray(ids) ? ids.filter(isPhotoId) : [];
  if(!list.length) return '';
  return `<div class="photos">${list.map(id=>`<button class="photo" onclick="openPhoto('${id}')" aria-label="Lihat foto"><img src="/api/photos/${id}" alt="Foto di catatan" loading="lazy"></button>`).join('')}</div>`;
}
// Full-size view. It lives outside #app, so re-rendering the page underneath does not close it.
function openPhoto(id){
  closePhoto();
  const box = document.createElement('div');
  box.className = 'lightbox'; box.id = 'lightbox';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Foto');
  box.innerHTML = `<img src="/api/photos/${id}" alt="Foto di catatan"><button class="icon-btn" aria-label="Tutup foto">${ICONS.close}</button>`;
  box.onclick = closePhoto;

}
function closePhoto(){ document.getElementById('lightbox')?.remove(); }

// ---------- First-visit tour ----------
// Each step explains one thing on the page, on the tab it lives on.
//   around  — highlight all of these together (things that sit next to each other)

let tourSteps = [];      // the steps of the tour in progress: TOUR without the ones that do not apply
let tourWatch = null, tourFrame = 0;
const resolve = v => typeof v==='function' ? v() : v;
function startTour(){
  if(!me || tourOn) return;
  closePhoto(); closeCamera();
  tourSteps = TOUR.filter(step=>!step.when || step.when());
  tourOn = true; tourIdx = 0;
  const box = document.createElement('div');
  box.className = 'tour'; box.id = 'tour';
  box.setAttribute('role', 'dialog'); box.setAttribute('aria-modal', 'true'); box.setAttribute('aria-labelledby', 'tourTitle');
  box.innerHTML = '<div class="tour-hole"></div><div class="tour-card" aria-live="polite"></div>';
  document.body.appendChild(box);
  // The page holds still while it is being explained, and has room to scroll any card to the top.
  document.documentElement.style.overflow = 'hidden';
  document.documentElement.classList.add('touring');
  // Things can still move under the tour — a late response, a rotated phone, a stray scroll — so
  // the highlight is re-placed whenever they do.
  if('ResizeObserver' in window){ tourWatch = new ResizeObserver(followTour); tourWatch.observe(document.getElementById('app')); }
  window.addEventListener('scroll', followTour, {passive:true});
  window.addEventListener('resize', followTour);
  showTourStep();
}
function followTour(){
  if(tourFrame) return;
  tourFrame = requestAnimationFrame(()=>{ tourFrame = 0; placeTour(); });
}
function showTourStep(){
  const step = tourSteps[tourIdx], last = tourIdx===tourSteps.length-1;
  if(tab!==step.tab) setTab(step.tab);
  const card = document.querySelector('#tour .tour-card');
  card.innerHTML = `
    <span class="eyebrow">Langkah ${tourIdx+1} dari ${tourSteps.length}</span>
    <h2 class="section-h" id="tourTitle">${resolve(step.title)}</h2>
    <p class="tour-text">${resolve(step.text)}</p>
    <div class="tour-actions">
      ${tourIdx>0 ? '<button class="btn-ghost-sm" onclick="tourGo(-1)">Kembali</button>' : ''}
      ${last ? '' : '<button class="btn-ghost-sm" onclick="endTour(true)">Lewati</button>'}
      <button class="tour-next" onclick="tourGo(1)">${last ? 'Mulai menulis' : 'Lanjut'}</button>
    </div>`;
  card.classList.remove('in'); void card.offsetWidth; card.classList.add('in');   // replay the entrance
  placeTour();
  card.querySelector('.tour-next').focus({preventScroll:true});
}
// The elements a step points at that are actually on screen, or null.
function tourElements(step){
  const onScreen = q => { const e = document.querySelector(q); return e && e.getClientRects().length ? e : null; };
  if(step.around){ const all = step.around.map(onScreen).filter(Boolean); return all.length ? all : null; }
  const first = (step.target||[]).map(onScreen).find(Boolean);
  return first ? [first] : null;
}
function boxAround(els){
  const rects = els.map(e=>e.getBoundingClientRect());
  return {left:Math.min(...rects.map(r=>r.left)), top:Math.min(...rects.map(r=>r.top)), right:Math.max(...rects.map(r=>r.right)), bottom:Math.max(...rects.map(r=>r.bottom))};
}
// Puts the hole over the step's subject and the card next to it, wherever it fits without covering
// the subject: below, above, or beside it. Only when none of those fit (a tall card on a phone)
// is the card pinned to the bottom, and then the hole stops above it.
function placeTour(){
  const box = document.getElementById('tour');
  if(!box) return;
  const hole = box.querySelector('.tour-hole'), card = box.querySelector('.tour-card');
  const vw = window.innerWidth, vh = window.innerHeight, cw = card.offsetWidth, ch = card.offsetHeight, gap = 14;
  const centred = x => Math.min(Math.max(16, x-cw/2), vw-cw-16);
  const els = tourElements(tourSteps[tourIdx]);
  if(!els){
    Object.assign(hole.style, {left:vw/2+'px', top:vh/2+'px', width:'0px', height:'0px'});
    Object.assign(card.style, {left:(vw-cw)/2+'px', top:Math.max(16,(vh-ch)/2)+'px'});
    return;
  }
  // Bring the subject just under the top of the screen (below the floating bar on desktop).
  // Things that float with the screen — the tab bar, the top bar — stay where they are.
  let floats = false;
  for(let n=els[0]; n && n!==document.body; n=n.parentElement) if(getComputedStyle(n).position==='fixed'){ floats = true; break; }
  const wanted = boxAround(els).top - (vw>=1024 ? 110 : 72);
  if(!floats && Math.abs(wanted)>1) window.scrollBy({top:wanted, behavior:'instant'});
  const b = boxAround(els);
  const left = Math.max(8, b.left-8), top = Math.max(8, b.top-8), right = Math.min(vw-8, b.right+8), bottom = Math.min(vh-8, b.bottom+8);
  let x = centred((left+right)/2), y, holeBottom = bottom;
  if(vh-bottom >= ch+gap*2) y = bottom+gap;
  else if(top >= ch+gap*2) y = top-gap-ch;
  else if(vw-right >= cw+gap*2 || left >= cw+gap*2){
    x = vw-right >= cw+gap*2 ? right+gap : left-gap-cw;
    y = Math.min(Math.max(16, top), vh-ch-16);
  } else {
    y = vh-ch-16;
    if(y-12-top >= 80) holeBottom = y-12;
  }
  const radius = els.length>1 ? 24 : Math.min(40, (parseFloat(getComputedStyle(els[0]).borderTopLeftRadius)||16)+8);
  Object.assign(hole.style, {left:left+'px', top:top+'px', width:(right-left)+'px', height:(holeBottom-top)+'px', borderRadius:radius+'px'});
  Object.assign(card.style, {left:x+'px', top:y+'px'});
}
function tourGo(d){
  if(!tourOn) return;
  if(tourIdx+d>=tourSteps.length){ endTour(true); return; }
  tourIdx = Math.max(0, tourIdx+d);
  showTourStep();
}
// finished=true (the last step, or "Lewati") is remembered on the account so it never auto-starts again.
function endTour(finished){
  if(!tourOn) return;
  tourOn = false;
  if(tourWatch){ tourWatch.disconnect(); tourWatch = null; }
  if(tourFrame){ cancelAnimationFrame(tourFrame); tourFrame = 0; }
  window.removeEventListener('scroll', followTour);
  window.removeEventListener('resize', followTour);
  document.getElementById('tour')?.remove();
  document.documentElement.style.overflow = '';
  document.documentElement.classList.remove('touring');
  if(!finished) return;
  if(!tourDone){ tourDone = true; persistProfile({tourDone:true}); }
  if(tab!=='today') setTab('today');
  window.scrollTo({top:0, behavior:'instant'});
}

document.addEventListener('keydown', e=>{
  if(tourOn){
    if(e.key==='Escape') endTour(true);
    else if(e.key==='ArrowRight') tourGo(1);
    else if(e.key==='ArrowLeft') tourGo(-1);
    return;
  }
  if(e.key!=='Escape') return;
  if(document.getElementById('camera')) closeCamera();
  else if(document.getElementById('lightbox')) closePhoto();
});

const OFFLINE_NOTE = 'Azzifa belum bisa terhubung ke server. Coba lagi sebentar lagi, ya.';
async function saveName(ev){
  ev.preventDefault();
  document.getElementById('nameErr').hidden = true;
  const name = document.getElementById('profName').value.trim();
  try{
    const res = await api('/api/account/profile', {method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})});
    const data = await res.json();
    if(!res.ok){ formError('nameErr', data.error || 'Namanya belum tersimpan. Coba lagi sebentar lagi, ya.'); return; }
    me = {...me, name:data.name};
    showToast('Namamu sudah diperbarui.'); render();
    if(circles.length) loadCircles();   // friends see the new name there
  }catch(e){ formError('nameErr', OFFLINE_NOTE); }
}
async function savePassword(ev){
  ev.preventDefault();
  document.getElementById('pwErr').hidden = true;
  const current = document.getElementById('pwCurrent').value, next = document.getElementById('pwNext').value;
  try{
    const res = await api('/api/account/password', JSON_POST({current, next}));
    const data = await res.json();
    if(!res.ok){ formError('pwErr', data.error || 'Kata sandinya belum berhasil diganti. Coba lagi sebentar lagi, ya.'); return; }
    ev.target.reset();
    showToast('Kata sandimu sudah diganti.');
  }catch(e){ formError('pwErr', OFFLINE_NOTE); }
}

function setTab(t){
  syncDraft(); tab=t;
  if(t!=='history') histDate=null;
  if(t==='trend') ensureInsight();
  animateContent=true; render();
  if(t!=='history' && circles.length) loadCircles();

  const c=document.querySelector('.content');
  if(c && c.getBoundingClientRect().top<0) c.scrollIntoView({block:'start'});
}
// Before the first note of the day the choice simply waits for it. Once the day has an entry,
// picking a mood updates that day straight away, so a feeling can change without writing more.
async function selectMood(k){
  const existing = entries.find(e=>e.date===todayStr());
  if(!existing){ selectedMood=k; render(); return; }
  if(existing.mood===k) return;
  const entry = {...existing, mood:k};
  try{ await persistEntry(entry); }
  catch(e){ showToast('Perasaanmu belum tersimpan. Coba lagi sebentar lagi, ya.'); return; }
  entries = [...entries.filter(e=>e.date!==entry.date), entry];
  selectedMood = null;
  showToast(`Perasaan hari ini dicatat: ${moodInfo(k).l}.`);
  syncDraft(); render();
}
function swapPrompt(){ promptIdx=pickPrompt(); render(); }
function editNote(i){
  syncDraft(); if(editingIdx===null){ stashedDraft=draftText; stashedPhotos=draftPhotos; }
  editingIdx=i; draftText=null; draftPhotos=[...(todayNotes()[i].photos||[])].filter(isPhotoId); render();
  const ta=document.getElementById('entryText');
  if(ta){ ta.focus(); ta.scrollIntoView({behavior:'smooth', block:'center'}); }
}
function cancelEdit(){ editingIdx=null; draftText=stashedDraft; stashedDraft=null; draftPhotos=stashedPhotos||[]; stashedPhotos=null; render(); }
async function saveEntry(){
  const text=document.getElementById('entryText').value.trim();
  if(photoBusy){ showToast('Fotonya masih diunggah. Tunggu sebentar, ya.'); return; }
  if(!text && !draftPhotos.length){ showToast('Tulis dulu sedikit, ya. Satu kalimat atau satu foto juga boleh.'); return; }
  const date=todayStr();
  const existing=entries.find(e=>e.date===date);
  const notes=existing ? notesOf(existing).map(n=>({...n})) : [];
  const wasEditing = editingIdx!==null && !!notes[editingIdx];
  if(wasEditing){
    const n=notes[editingIdx]; n.text=text;
    if(draftPhotos.length) n.photos=[...draftPhotos]; else delete n.photos;
  }
  else{
    const stepPrompt = dayMode==='daily' ? (DAILY_STEPS[notes.length] || DAILY_STEPS[DAILY_STEPS.length-1]) : PROMPTS[promptIdx];
    notes.push({prompt:stepPrompt, text, at:Date.now(), ...(draftPhotos.length ? {photos:[...draftPhotos]} : {})});
  }
  const mood=selectedMood || (existing && existing.mood) || 'biasa';
  const entry={date, mood, prompt:notes[0].prompt, text:notes.map(n=>n.text).filter(Boolean).join('\n\n'), notes, updatedAt:Date.now()};
  if(existing && existing.daySummary) entry.daySummary = existing.daySummary;
  try{ await persistEntry(entry); }
  catch(e){ showToast('Belum berhasil tersimpan. Tulisanmu masih aman di sini, coba lagi sebentar lagi, ya.'); return; }
  entries=[...entries.filter(e=>e.date!==date), entry];
  selectedMood=null; editingIdx=null;
  if(wasEditing){ draftText=stashedDraft; stashedDraft=null; draftPhotos=stashedPhotos||[]; stashedPhotos=null; }
  else{ draftText=null; draftPhotos=[]; forgetDraft(); promptIdx=pickPrompt(notes); }   // next Check Up question appears on its own
  showToast(SAVE_MESSAGES[Math.floor(Math.random()*SAVE_MESSAGES.length)]); render();
  if(!wasEditing && circles.length) loadCircles();
  if(!wasEditing && ai.configured && dayMode==='daily' && notes.length===DAILY_STEPS.length){
    generateDaySummary();   // fourth step just landed — wrap the day up automatically
  }
}

async function generateDaySummary(){

  if(notes.length===0){ daySummaryErr='Belum ada catatan hari ini. Tulis dulu sedikit, ya.'; render(); return; }

function seriesForRange(n){
  const byDate={}; entries.forEach(e=>byDate[e.date]=e);
  const days=[];
  for(let i=n-1;i>=0;i--){ const s=daysAgo(i); const e=byDate[s];
    days.push({date:s, value: e?MOOD_ORDER.indexOf(e.mood)+1:null, mood: e?e.mood:null}); }
  return days;
}

  if(totalNotes()<3) return 'Tulis 3 catatan dulu, ya. Setelah itu Azzifa bisa mengamati polanya.';
  return esc(insightNote) || 'Pengamatan minggu ini belum tersedia. Coba buka lagi nanti, ya.';
}
function renderChartSVG(days){
  const w=440,h=160,padL=28,padR=10,padT=10,padB=24, innerW=w-padL-padR, innerH=h-padT-padB, stepX=innerW/(days.length-1||1);
  const yFor=v=>padT+innerH-((v-1)/4)*innerH;
  let segments=[],current=[];
  days.forEach((d,i)=>{ const x=padL+i*stepX; if(d.value===null){ if(current.length){segments.push(current);current=[];} } else current.push({x,y:yFor(d.value)}); });
  if(current.length) segments.push(current);
  const pathFor=seg=>'M'+seg.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' L');
  const gridLines=[1,2,3,4,5].map(v=>`<line x1="${padL}" y1="${yFor(v)}" x2="${w-padR}" y2="${yFor(v)}" stroke="var(--line)" stroke-width="1"/>`).join('');
  const emojiLabels=MOODS.map((m,i)=>`<text x="${padL-8}" y="${yFor(i+1)+4}" font-size="10" text-anchor="end">${m.e}</text>`).join('');
  const xLabels=days.map((d,i)=>{ const show=days.length<=7||i%Math.ceil(days.length/6)===0||i===days.length-1; if(!show) return '';
    return `<text x="${(padL+i*stepX).toFixed(1)}" y="${h-6}" font-size="9.5" text-anchor="middle" fill="var(--ink-soft)">${fmtShort(d.date)}</text>`; }).join('');
  const lines=segments.map(seg=>`<path d="${pathFor(seg)}" fill="none" stroke="var(--rose)" stroke-width="2"/>`).join('');
  const dots=days.filter(d=>d.value!==null).map(d=>{ const i=days.indexOf(d); const x=padL+i*stepX; const y=yFor(d.value);
    return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="4" fill="${moodInfo(d.mood).c}"/>`; }).join('');
  return `<div class="chart-draw"><svg viewBox="0 0 ${w} ${h}" style="width:100%; height:auto; display:block;">${gridLines}${emojiLabels}${lines}${dots}${xLabels}</svg></div>`;
}
function weekKey(){
  return daysAgo((new Date().getDay()+6)%7); // this week's Monday (the server derives the same key)
}
async function ensureInsight(){
  if(insightWeekCached===weekKey() && dashboardInsight){ render(); return; }
  if(!ai.configured){ dashboardInsight=null; return; }   // nothing to ask, and nothing to apologise for in a toast
  if(totalNotes()<3){ dashboardInsight=null; return; }
  if(insightLoading) return;
  insightLoading=true; render();
  try{
    const res = await api('/api/insight', {method:'POST'});
    const data = await res.json();
    if(!res.ok){ dashboardInsight = null; insightNote = data.error || null; }
    else{ dashboardInsight = data.text; insightWeekCached = data.week; insightNote = null; }
  }catch(e){ dashboardInsight = null; }
  insightLoading=false; render();
}

  try{

    if(!res.ok) return fail(data.error || 'Belum berhasil masuk. Coba lagi sebentar lagi, ya.');
  }catch(e){ return fail('Azzifa belum bisa terhubung ke server. Coba lagi sebentar lagi, ya.'); }

function calShift(n){
  const [y,m]=(calMonth||todayStr().slice(0,7)).split('-').map(Number);

function renderCalendar(){
  const today=todayStr();
  const ym=calMonth||today.slice(0,7);
  const [y,m]=ym.split('-').map(Number);
  const first=new Date(Date.UTC(y,m-1,1));
  const lead=(first.getUTCDay()+6)%7; // Monday = 0
  const daysInMonth=new Date(Date.UTC(y,m,0)).getUTCDate();
  const byDate={}; entries.forEach(e=>byDate[e.date]=e);
  const title=first.toLocaleDateString('id-ID',{month:'long',year:'numeric',timeZone:'UTC'});
  let cells='';
  for(let i=0;i<lead;i++) cells+='<span></span>';
  for(let d=1;d<=daysInMonth;d++){
    const date=`${ym}-${String(d).padStart(2,'0')}`;
    const e=byDate[date];
    const todayCls=date===today?' today':'';
    if(e){
      const mi=moodInfo(e.mood), n=notesOf(e).length;
      cells+=`<button class="cal-day has${todayCls}" style="background:${mi.c}47" onclick="openDay('${date}')" aria-label="${fmtDate(date)}, ${mi.l}, ${n} catatan">${d}</button>`;
    } else {
      cells+=`<span class="cal-day${todayCls}">${d}</span>`;
    }
  }
  return `
    <div class="card">
      <div class="cal-head">
        <h2 class="section-h">${title}</h2>
        <div class="cal-nav">
          <button class="icon-btn" onclick="calShift(-1)" title="Bulan sebelumnya" aria-label="Bulan sebelumnya">${ICONS.chevLeft}</button>
          <button class="icon-btn" onclick="calShift(1)" title="Bulan berikutnya" aria-label="Bulan berikutnya" ${ym>=today.slice(0,7)?'disabled':''}>${ICONS.chevRight}</button>
        </div>
      </div>
      <div class="cal-grid">
        ${['Sen','Sel','Rab','Kam','Jum','Sab','Min'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}
        ${cells}
      </div>
      <div class="cal-legend">${MOODS.map(mo=>`<span><i style="background:${mo.c}"></i>${mo.l}</span>`).join('')}</div>
    </div>`;
}

        <div class="lbl">Pengamatan AI minggu ini</div>
        ${insightLoading ? '<div class="skeleton" role="status" aria-label="Menganalisis pola"><span></span><span></span><span class="short"></span></div>' : (dashboardInsight ? esc(dashboardInsight) : insightEmptyText())}
      </div>
    </div>
    </div>
    <div class="col col-side">
    <div class="card" id="circleCard">${renderCircleCard()}</div>

}
// ---------- History + export ----------
function exportTxt(){
  if(entries.length===0){ showToast('Belum ada catatan untuk diekspor. Mulai dari satu catatan dulu, ya.'); return; }
  window.location.href = '/api/export.txt';
}
function printReport(){
  if(entries.length===0){ showToast('Belum ada catatan untuk dicetak. Mulai dari satu catatan dulu, ya.'); return; }
  const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date));
  document.getElementById('printArea').innerHTML = `
    <h2 style="font-family:'Plus Jakarta Sans',sans-serif; font-weight:700;">Azzifa — Catatan Refleksi</h2>
